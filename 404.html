<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Страница не найдена — Lovix Design</title>
<style>
  /* GitHub Pages отдаёт эту страницу на любой неизвестный адрес любой глубины,
     поэтому стили встроены, а ссылки считаются от корня проекта в скрипте ниже. */
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    font-family: "Proxima Nova", "Mulish", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; background: linear-gradient(to bottom right, rgb(37,54,107) 0%, rgb(34,31,34) 60%);
  }
  .box { max-width: 520px; text-align: center; }
  .code { font-size: 4.5rem; font-weight: 900; line-height: 1; background: linear-gradient(90deg, #d946ef, #f43f5e); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 { font-size: 1.5rem; margin-top: 14px; }
  p { color: #a3a3b4; margin-top: 10px; line-height: 1.55; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  a.btn { padding: 12px 20px; border-radius: 12px; font-weight: 700; text-decoration: none; color: #fff; }
  .grad { background: linear-gradient(90deg, #d946ef, #f43f5e); }
  .out { border: 1px solid rgba(255,255,255,.22); }
  .out:hover { border-color: #d946ef; }
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Такой страницы в макетах нет</h1>
  <p id="why">Возможно, экран ещё не прорисован или адрес устарел. Все экраны и материалы — на карте макетов.</p>
  <div class="row">
    <a class="btn grad" id="home" href="/lovix-design/">На главную</a>
    <a class="btn out" id="map" href="/lovix-design/design/">Карта макетов</a>
  </div>
</div>
<script>
  // корень проекта: на GitHub Pages — /lovix-design/, локально — /
  var base = location.pathname.indexOf('/lovix-design/') === 0 ? '/lovix-design/' : '/';
  document.getElementById('home').href = base;
  document.getElementById('map').href = base + 'design/';
  // маршруты прода lovix.ai, которых в прототипе нет — подсказать, что это за экран
  var rel = location.pathname.slice(base.length).replace(/\/$/, '');
  var KNOWN = { 'companion-builder': 'конструктор компаньонов', 'ai-anime': 'раздел «Аниме»', 'ai-boyfriend': 'раздел «Парни»',
    'ai-girlfriend': 'раздел каталога «Девушки»', 'about': 'страница «О нас»', 'contacts': 'контакты', 'affiliate': 'партнёрская программа' };
  if (KNOWN[rel]) document.getElementById('why').textContent = 'На проде здесь ' + KNOWN[rel] + ' — в макетах этот экран ещё не прорисован.';
</script>
</body>
</html>
