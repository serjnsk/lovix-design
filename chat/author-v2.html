<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Автор в профиле — вариант 2 (аватар + подписка) -->
<title>Lovix — Чат с компаньоном</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lovix.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .page { display: flex; flex-direction: column; height: 100vh; }
  .tb { flex: none; }

  /* топбар чат-страницы: баланс + подписка */
  .balance {
    display: flex; align-items: center; gap: 7px;
    font-weight: 800; font-size: .95rem;
    padding: 8px 15px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04);
  }
  .balance .ic { width: 15px; height: 15px; }
  .balance.flash { animation: balf .6s; }
  @keyframes balf { 30% { transform: scale(1.1); } 60% { transform: scale(1); } }
  .balance.flash b { color: #f0abfc; }
  .subact {
    display: flex; align-items: center; gap: 8px; position: relative;
    padding: 9px 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: linear-gradient(90deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    color: #fff; font-weight: 800; font-size: .88rem; white-space: nowrap;
    box-shadow: 0 0 26px rgba(217,70,239,.4);
  }
  .subact .ic { width: 15px; height: 15px; }
  .subact .demotag {
    position: absolute; top: -7px; right: -6px;
    font-size: .52rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    background: #3f3f4a; border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px; padding: 1.5px 6px; color: #e4e4ef;
  }

  .sbcnt {
    margin-left: auto; background: #ef4444; color: #fff;
    font-size: .68rem; font-weight: 800; font-style: normal;
    min-width: 18px; height: 18px; border-radius: 999px; padding: 0 5px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ================= каркас 3 колонок ================= */
  .chatwrap { flex: 1; min-height: 0; display: flex; }

  /* ---------- колонка 1: список чатов ---------- */
  .cl {
    width: 305px; flex: none; display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid rgba(255,255,255,.07);
    background: rgba(10,9,11,.45);
  }
  .cl-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 10px; }
  .cl-h b { font-size: 1.15rem; font-weight: 800; }
  .cl-new {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04);
    display: flex; align-items: center; justify-content: center; color: #cfcfdd;
  }
  .cl-new:hover { background: rgba(217,70,239,.16); color: #fff; border-color: rgba(217,70,239,.45); }
  .cl-new .ic { width: 16px; height: 16px; }
  .cl-search { margin: 0 16px 12px; position: relative; }
  .cl-search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: rgb(var(--muted2)); }
  .cl-search input {
    width: 100%; padding: 9px 12px 9px 34px; border-radius: 10px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
    color: #fff; font-family: inherit; font-size: .88rem; outline: none;
  }
  .cl-search input:focus { border-color: rgba(217,70,239,.5); }
  .cl-search input::placeholder { color: rgb(var(--muted2)); }
  .cl-list { flex: 1; overflow-y: auto; padding: 0 8px 14px; }

  .ava {
    width: 48px; height: 48px; border-radius: 50%; flex: none; position: relative;
    background: linear-gradient(160deg, #3b2f52, #241e33);
  }
  .ava .ph { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  .ava .ph img { width: 100%; height: 420%; object-fit: cover; object-position: 50% 0; }
  .ava .init {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-style: normal; font-weight: 800; font-size: 1.05rem; color: #e9d5ff;
  }
  .ava.pinkbot { background: linear-gradient(135deg, rgb(var(--acc-from)), rgb(var(--acc-to))); }
  .ava.pinkbot .init .ic { width: 20px; height: 20px; color: #fff; }
  .ava .dot {
    position: absolute; right: 0; bottom: 1px; width: 12px; height: 12px; border-radius: 50%;
    background: #22c55e; border: 2.5px solid #131114; z-index: 2;
  }

  .ci { display: flex; gap: 11px; padding: 10px; border-radius: 12px; cursor: pointer; align-items: center; }
  .ci:hover { background: rgba(255,255,255,.05); }
  .ci.on { background: rgba(255,255,255,.09); }
  .ci-mid { flex: 1; min-width: 0; }
  .ci-r1 { display: flex; align-items: baseline; gap: 8px; }
  .ci-r1 b { font-size: .92rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-r1 small { margin-left: auto; flex: none; color: rgb(var(--muted2)); font-size: .72rem; }
  .ci-r2 { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .ci-r2 p { flex: 1; min-width: 0; color: rgb(var(--muted)); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unr {
    flex: none; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: linear-gradient(90deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    color: #fff; font-size: .68rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- колонка 2: чат ---------- */
  .cc { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  /* фон ленты зависит от режима общения */
  .ccbg { position: absolute; inset: 0; pointer-events: none; transition: opacity .8s ease; }
  .ccbg.rp {
    background:
      radial-gradient(1000px 560px at 80% 115%, rgba(244,63,94,.30), transparent 62%),
      radial-gradient(820px 480px at 12% -10%, rgba(147,51,234,.22), transparent 60%),
      linear-gradient(185deg, #1b1520 0%, #221126 55%, #2f1120 100%);
  }
  .ccbg.chat { background: linear-gradient(180deg, #1b191f, #161419); }
  .cc[data-mode="rp"] .ccbg.chat { opacity: 0; }
  .cc[data-mode="chat"] .ccbg.rp { opacity: 0; }

  .cc-h {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px;
    border-bottom: 1px solid rgba(255,255,255,.06);
    background: rgba(12,10,13,.55); backdrop-filter: blur(8px);
    position: relative; z-index: 5;
  }
  .cc-h .ava { width: 44px; height: 44px; }
  .cc-name b { font-size: 1.02rem; font-weight: 800; display: block; }
  .cc-onl { font-size: .78rem; color: #4ade80; }
  .cc-acts { margin-left: auto; display: flex; align-items: center; gap: 9px; }

  .icbtn {
    width: 38px; height: 38px; border-radius: 50%; position: relative; cursor: pointer;
    border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.03);
    display: flex; align-items: center; justify-content: center; color: #cfcfdd;
  }
  .icbtn:hover { background: rgba(255,255,255,.09); color: #fff; }
  .icbtn .ic { width: 17px; height: 17px; }
  .viptag {
    position: absolute; top: -6px; right: -8px;
    font-size: .52rem; font-weight: 800; letter-spacing: .03em;
    background: linear-gradient(90deg, #f59e0b, #f43f5e);
    border-radius: 999px; padding: 1.5px 5px; color: #fff;
  }

  .mseg {
    display: flex; gap: 2px; padding: 3px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); border-radius: 999px;
  }
  .mseg button {
    border: 0; background: transparent; cursor: pointer;
    color: rgb(var(--muted)); font-weight: 700; font-size: .8rem;
    padding: .42rem .95rem; border-radius: 999px; font-family: inherit;
  }
  .mseg button:hover { color: #fff; }
  .mseg button.on {
    background: linear-gradient(90deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    color: #fff; box-shadow: 0 3px 14px rgba(217,70,239,.35);
  }

  /* лента */
  .feed {
    flex: 1; overflow-y: auto; position: relative; z-index: 1;
    padding: 22px 26px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .dv {
    align-self: center; flex: none;
    font-size: .74rem; font-weight: 600; color: #cfc3d8;
    background: rgba(20,16,22,.55); backdrop-filter: blur(4px);
    padding: 4px 13px; border-radius: 999px; margin: 8px 0 2px;
  }

  .m { max-width: min(64%, 560px); display: flex; flex-direction: column; gap: 4px; animation: mIn .25s ease; }
  @keyframes mIn { from { opacity: 0; transform: translateY(8px); } }
  .m.bot { align-self: flex-start; }
  .m.me { align-self: flex-end; }
  .bub { padding: 11px 14px; border-radius: 16px; font-size: .95rem; line-height: 1.5; word-wrap: break-word; }
  .m.bot .bub {
    background: rgba(255,255,255,.075); border: 1px solid rgba(255,255,255,.05);
    border-bottom-left-radius: 5px; backdrop-filter: blur(6px);
  }
  .m.me .bub {
    background: linear-gradient(120deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    border-bottom-right-radius: 5px;
    box-shadow: 0 6px 24px rgba(217,70,239,.22);
  }
  .rp-act { font-style: italic; color: #d8b4fe; }
  .m.me .rp-act { color: rgba(255,255,255,.88); }
  .meta { display: flex; align-items: center; gap: 4px; padding: 0 4px; font-size: .7rem; color: rgb(var(--muted2)); }
  .m.me .meta { justify-content: flex-end; }

  /* фото-сообщение */
  .bub.mph { padding: 6px; }
  .phbox {
    width: 300px; max-width: 100%; height: 370px; border-radius: 12px;
    overflow: hidden; position: relative; cursor: zoom-in;
    background: linear-gradient(165deg, #7c3aed, #312e81 55%, #171033);
  }
  .phbox::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(340px 220px at 70% 20%, rgba(232,121,249,.35), transparent 70%);
  }
  .phbox img { position: absolute; top: -6px; left: 50%; transform: translateX(-50%); height: 158%; }
  .mph .cap { padding: 8px 9px 5px; font-size: .92rem; }

  /* голосовое */
  .vc { display: flex; align-items: center; gap: 11px; padding: 3px 2px 2px; }
  .vc .pl {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
    background: linear-gradient(120deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    display: flex; align-items: center; justify-content: center; color: #fff;
    box-shadow: 0 4px 16px rgba(217,70,239,.4);
  }
  .vc .pl .ic { width: 15px; height: 15px; }
  .vc .bars { display: flex; gap: 2.5px; align-items: center; height: 28px; }
  .vc .bars i { width: 3px; border-radius: 2px; background: rgba(255,255,255,.32); }
  .vc .bars i.f { background: #f0abfc; }
  .vc .dur { font-size: .74rem; color: rgb(var(--muted)); flex: none; }

  /* ошибка ответа */
  .errb {
    background: rgba(239,68,68,.09) !important;
    border: 1px solid rgba(239,68,68,.35) !important;
  }
  .errb .er { display: flex; gap: 10px; align-items: flex-start; }
  .errb .er .ic { width: 18px; height: 18px; color: #f87171; flex: none; margin-top: 2px; }
  .errb b { font-size: .92rem; }
  .errb p { font-size: .84rem; color: rgb(var(--muted)); margin-top: 2px; }
  .errb .btn { margin-top: 10px; padding: .5rem 1.1rem; font-size: .85rem; }

  /* пейволл-карточка в ленте (VIP-гейт) */
  .payw {
    align-self: center; width: min(400px, 92%);
    border: 1.5px solid transparent; border-radius: 16px; padding: 16px 18px;
    background:
      linear-gradient(rgba(26,18,26,.96), rgba(26,18,26,.96)) padding-box,
      linear-gradient(120deg, #f59e0b, rgb(var(--acc-to))) border-box;
    box-shadow: 0 10px 40px rgba(0,0,0,.4), 0 0 30px rgba(244,63,94,.15);
    animation: mIn .3s ease;
  }
  .payw .pw-h { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: .95rem; }
  .payw .pw-h .ic { width: 17px; height: 17px; color: #fbbf24; }
  .payw p { color: rgb(var(--muted)); font-size: .84rem; margin-top: 5px; line-height: 1.5; }
  .payw .row { display: flex; gap: 9px; margin-top: 13px; flex-wrap: wrap; }
  .payw .btn { padding: .55rem 1.1rem; font-size: .85rem; }

  /* печатает… */
  .typing .bub { display: flex; gap: 5px; padding: 15px 16px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: #c9a8d8; animation: tp 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes tp { 0%, 60%, 100% { opacity: .25; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

  /* блок сценариев в пустом чате */
  .scen { align-self: center; width: min(660px, 96%); margin-top: 8px; animation: mIn .3s ease; }
  .scen h4 { font-size: 1.02rem; font-weight: 800; }
  .scen .s { color: rgb(var(--muted)); font-size: .85rem; margin: 3px 0 13px; }
  .stabs {
    display: flex; gap: 3px; padding: 4px; margin-bottom: 12px;
    background: rgba(16,14,16,.6); border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
  }
  .stabs button {
    flex: 1; border: 0; background: transparent; cursor: pointer; font-family: inherit;
    color: rgb(var(--muted)); font-weight: 700; font-size: .9rem;
    padding: .6rem; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .stabs button:hover { color: #fff; }
  .stabs button.on {
    background: linear-gradient(90deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    color: #fff;
  }
  .stabs button.sp.on {
    background: rgba(80,15,15,.55);
    box-shadow: inset 0 0 0 1px rgba(239,68,68,.65), 0 0 18px rgba(239,68,68,.22);
  }
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .scn {
    position: relative; overflow: hidden; text-align: left; cursor: pointer; font-family: inherit; color: #fff;
    background: rgba(16,14,16,.62); border: 1px solid rgba(255,255,255,.09); border-radius: 12px;
    padding: 13px 15px; transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .scn:hover { border-color: rgba(217,70,239,.5); transform: translateY(-1px); }
  .scn b { font-size: .92rem; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .scn b .ic { width: 13px; height: 13px; color: rgb(var(--muted2)); flex: none; }
  .scn p { color: rgb(var(--muted)); font-size: .78rem; margin-top: 3px; line-height: 1.4; }
  .scn.sp:hover { border-color: rgba(239,68,68,.65); box-shadow: 0 0 18px rgba(239,68,68,.18); }
  /* spicy заперт на Free */
  .scn.lk p { opacity: .55; }
  .scn.lk .lki { color: #fbbf24; }
  .scn.lk:hover { border-color: rgba(245,158,11,.55); transform: none; box-shadow: none; }
  .pi .lki { margin-left: auto; color: #fbbf24; width: 15px; height: 15px; flex: none; }
  .pep { position: absolute; top: -16px; opacity: 0; pointer-events: none; font-size: 13px; font-style: normal; }
  .scn.sp:hover .pep { animation: pepfall var(--pd, 1.4s) linear var(--pdel, 0s) infinite; }
  @keyframes pepfall {
    0% { transform: translateY(0) rotate(-24deg); opacity: 0; }
    12% { opacity: .95; }
    82% { opacity: .85; }
    100% { transform: translateY(112px) rotate(26deg); opacity: 0; }
  }

  /* инпут-зона */
  .inbar {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 18px 14px; position: relative; z-index: 6;
    border-top: 1px solid rgba(255,255,255,.06);
    background: rgba(12,10,13,.6); backdrop-filter: blur(8px);
  }
  /* единый блок: поле сверху, действия + отправка строкой внутри */
  .composer {
    flex: 1; position: relative; min-width: 0;
    border: 1px solid rgba(255,255,255,.11); border-radius: 16px;
    background: rgba(255,255,255,.05);
    padding: 2px 10px 9px;
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: rgba(217,70,239,.5); }
  .composer textarea {
    width: 100%; resize: none; display: block;
    border: 0; background: none; outline: none;
    color: #fff; font-family: inherit; font-size: .95rem; line-height: 1.45;
    padding: 14px 6px 10px; min-height: 64px; max-height: 150px;
  }
  .composer textarea::placeholder { color: rgb(var(--muted2)); }
  .crow { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 4px; }
  .crow .send { margin-left: auto; width: 40px; height: 40px; border-radius: 12px; }
  .crow .send.pricey { width: auto; }
  .cnt { position: absolute; right: 4px; top: -21px; font-size: .7rem; color: rgb(var(--muted2)); display: none; }
  .cnt.warn { display: block; }
  .cnt.max { color: #f87171; }
  .send {
    width: 46px; height: 46px; border-radius: 14px; border: 0; cursor: pointer; flex: none;
    background: linear-gradient(120deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    display: flex; align-items: center; justify-content: center; color: #fff;
    box-shadow: 0 6px 20px rgba(217,70,239,.4); transition: filter .15s, opacity .15s;
  }
  .send:hover { filter: brightness(1.12); }
  .send .ic { width: 19px; height: 19px; }

  /* режим запроса медиа: цена показывается в кнопке отправки */
  .send.pricey { width: auto; padding: 0 15px; gap: 7px; }
  .send .sp { display: flex; align-items: center; gap: 4px; font-size: .84rem; font-weight: 800; white-space: nowrap; }
  .send .sp .ic { width: 12px; height: 12px; }

  /* сообщение-запрос медиа */
  .reqhead {
    display: flex; align-items: center; gap: 6px;
    font-size: .68rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    color: rgba(255,255,255,.87); margin-bottom: 5px;
  }
  .reqhead .ic { width: 13px; height: 13px; }

  /* видео-сообщение (VIP) */
  .bub.mvid { padding: 6px; }
  .vidbox {
    width: 300px; max-width: 100%; height: 190px; border-radius: 12px;
    overflow: hidden; position: relative; cursor: pointer;
    background: linear-gradient(165deg, #4c1d95, #1e1033);
  }
  .vidbox img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 10%; filter: blur(16px) brightness(.6); transform: scale(1.15); }
  .vidbox .lockc {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;
  }
  .vidbox .plc {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(0,0,0,.45); border: 1.5px solid rgba(255,255,255,.35);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .vidbox .plc .ic { width: 18px; height: 18px; }
  .vidbox .lockc small { font-size: .74rem; font-weight: 700; color: rgba(255,255,255,.92); }
  .vidbox .vtag {
    position: absolute; top: 9px; right: 9px; z-index: 2;
    font-size: .6rem; font-weight: 800; color: #fff;
    background: linear-gradient(90deg, #f59e0b, #f43f5e); border-radius: 999px; padding: 2.5px 8px;
  }
  .vidbox .vdur { position: absolute; left: 10px; bottom: 8px; z-index: 2; font-size: .72rem; font-weight: 700; color: rgba(255,255,255,.85); }
  .vidbox.unlocked img { filter: none; transform: none; }
  .vidbox.unlocked .plc { background: rgba(0,0,0,.5); }

  /* фото-бабл без снимка (у ботов без фото) */
  .phbox.noimg { display: flex; align-items: center; justify-content: center; cursor: default; height: 190px; }
  .phbox.noimg .phn { width: 44px; height: 44px; color: rgba(255,255,255,.6); }

  /* поповеры инпута */
  .pop {
    position: absolute; bottom: calc(100% + 10px); left: 16px; width: 292px;
    background: #1c1722; border: 1px solid rgba(255,255,255,.12); border-radius: 15px;
    padding: 8px; box-shadow: 0 18px 55px rgba(0,0,0,.6);
    display: none; z-index: 40;
  }
  .pop.open { display: block; animation: mIn .16s ease; }
  .pop.helper { left: auto; right: 14px; width: 330px; }
  .pop .ph4 { font-size: .78rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: rgb(var(--muted2)); padding: 7px 11px 5px; }
  .pi {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 10px 11px; border-radius: 10px; border: 0; background: none;
    color: #fff; cursor: pointer; text-align: left; font-family: inherit;
  }
  .pi:hover { background: rgba(255,255,255,.06); }
  .pi .ic { width: 18px; height: 18px; color: #e879f9; flex: none; }
  .pi b { font-size: .9rem; font-weight: 700; }
  .pi small { display: block; font-size: .72rem; color: rgb(var(--muted2)); margin-top: 1px; }
  .pi .pr {
    margin-left: auto; flex: none; display: flex; align-items: center; gap: 4px;
    font-size: .76rem; font-weight: 800; color: #f0abfc;
  }
  .pi .pr .ic { width: 11px; height: 11px; color: #f0abfc; }
  .pi .vt {
    margin-left: auto; flex: none; font-size: .62rem; font-weight: 800; color: #fff;
    background: linear-gradient(90deg, #f59e0b, #f43f5e); border-radius: 999px; padding: 2px 8px;
  }
  .pop.helper .stabs { margin: 4px 4px 8px; }
  .pop.helper .pi b { font-weight: 600; font-size: .88rem; }

  /* ---------- колонка 3: профиль ---------- */
  .cp {
    width: 305px; flex: none; overflow-y: auto; min-height: 0;
    border-left: 1px solid rgba(255,255,255,.07);
    background: rgba(10,9,11,.45);
  }
  .cp-photo {
    position: relative; height: 305px; cursor: zoom-in;
    background: linear-gradient(165deg, #6d28d9, #2e1065 62%, #150c26);
    overflow: hidden;
  }
  .cp-photo::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(300px 200px at 68% 12%, rgba(232,121,249,.4), transparent 70%);
  }
  .cp-photo img { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); height: 235%; }
  .cp-photo::after {
    content: ""; position: absolute; inset: auto 0 0; height: 70px;
    background: linear-gradient(180deg, transparent, rgba(10,9,11,.85));
  }
  .cp-photo.ph-init { display: flex; align-items: center; justify-content: center; cursor: default; }
  .cp-photo.ph-init span { font-size: 4.2rem; font-weight: 800; color: #efe3ff; }
  .cp-photo.ph-init .big { width: 78px; height: 78px; color: #fff; }
  .cp-photo.ph-init.pinkbg { background: linear-gradient(135deg, rgb(var(--acc-from)), rgb(var(--acc-to))); }
  .cp-body { padding: 14px 18px 22px; display: grid; gap: 15px; }
  .cp-name { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mybadge {
    font-size: .62rem; font-weight: 800; letter-spacing: .03em; color: #fff;
    background: linear-gradient(90deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    border-radius: 999px; padding: 3px 9px;
  }
  .cp-bio { color: rgb(var(--muted)); font-size: .86rem; line-height: 1.55; }
  .cp-bio.clip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .morelnk { border: 0; background: none; color: #e879f9; font-weight: 700; font-size: .8rem; cursor: pointer; padding: 0; font-family: inherit; justify-self: start; }
  .cp-sec { font-size: .72rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: rgb(var(--muted2)); }
  .facts { display: grid; gap: 11px; }
  .fact { display: flex; gap: 11px; align-items: center; }
  .fact .fi {
    width: 32px; height: 32px; border-radius: 9px; flex: none;
    background: rgba(217,70,239,.12); color: #e879f9;
    display: flex; align-items: center; justify-content: center;
  }
  .fact .fi .ic { width: 16px; height: 16px; }
  .fact small { display: block; color: rgb(var(--muted2)); font-size: .7rem; }
  .fact b { font-size: .86rem; font-weight: 700; }
  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .mi {
    aspect-ratio: 1; border-radius: 10px; overflow: hidden; position: relative; cursor: zoom-in;
    background: linear-gradient(160deg, #5b21b6, #1e1033);
    border: 0; padding: 0; display: block; width: 100%;
  }
  .mi img { width: 100%; height: 340%; object-fit: cover; object-position: 50% 0; }
  .mi .vplay {
    position: absolute; inset: 0; margin: auto; z-index: 2;
    width: 27px; height: 27px; border-radius: 50%;
    background: rgba(0,0,0,.52); border: 1.5px solid rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .mi .vplay .ic { width: 11px; height: 11px; }
  .mi .ov {
    position: absolute; inset: 0; z-index: 2;
    background: rgba(10,8,12,.62); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 1.02rem;
  }
  .mempty { color: rgb(var(--muted2)); font-size: .8rem; }

  /* модалка «Все медиа» */
  .mall {
    position: fixed; inset: 0; z-index: 88; display: none;
    background: rgba(8,6,10,.75); backdrop-filter: blur(7px);
    align-items: center; justify-content: center; padding: 24px;
  }
  .mall.open { display: flex; }
  .mall .mall-p {
    width: 560px; max-width: 94vw; max-height: 82vh; overflow-y: auto;
    background: #17131c; border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px; padding: 18px;
    box-shadow: 0 30px 90px rgba(0,0,0,.7);
  }
  .mall .mall-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
  .mall .mall-h b { font-size: 1.05rem; font-weight: 800; }
  .mall .mgrid { grid-template-columns: repeat(4, 1fr); }
  .mall .mx {
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.04);
    color: rgb(var(--muted)); display: flex; align-items: center; justify-content: center;
  }
  .mall .mx:hover { color: #fff; background: rgba(255,255,255,.1); }
  .mall .mx .ic { width: 14px; height: 14px; }
  /* строка автора компаньона — с аватаром и подпиской */
  .cp-author {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 16px;
    background: rgba(255,255,255,.05); border-radius: 12px;
    font-size: .82rem; color: rgb(var(--muted2));
  }
  .cp-author a { color: #f0abfc; font-weight: 600; cursor: pointer; }
  .cp-author a:hover { text-decoration: underline; }
  .cp-ver { width: 15px; height: 15px; color: rgb(var(--primary)); flex: none; }
  .cp-au-txt { display: flex; flex-direction: column; gap: 0; min-width: 0; }
  .cp-au-top { display: flex; align-items: center; gap: 5px; line-height: 1.15; }
  .cp-au-role { font-size: .71rem; line-height: 1.1; margin-top: 1px; color: rgb(var(--muted2)); }
  .cp-au-ava {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, rgb(var(--card-from)), rgb(var(--card-to)));
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem; font-weight: 800; color: #fff;
  }
  .cp-au-sub {
    margin-left: auto; white-space: nowrap; cursor: pointer;
    padding: .3rem .7rem; border-radius: 999px;
    font-size: .76rem; font-weight: 700; color: #fff;
    border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.04);
    transition: border-color .15s, background .15s, color .15s;
  }
  .cp-au-sub:hover { border-color: rgb(var(--primary)); background: rgba(217,70,239,.13); }
  .cp-au-sub.on { background: rgba(217,70,239,.18); border-color: rgba(217,70,239,.5); color: #f0abfc; }
  .cp .btn { padding: .62rem 1rem; font-size: .88rem; width: 100%; }
  .cp .btns { display: grid; gap: 8px; }

  /* лайтбокс */
  .lb {
    position: fixed; inset: 0; z-index: 90; display: none;
    background: rgba(8,6,10,.8); backdrop-filter: blur(8px);
    align-items: center; justify-content: center; padding: 30px; cursor: zoom-out;
  }
  .lb.open { display: flex; }
  .lb .frame {
    height: min(84vh, 780px); aspect-ratio: 4/7; max-width: 92vw;
    border-radius: 18px; overflow: hidden; position: relative;
    background: linear-gradient(165deg, #7c3aed, #312e81 55%, #171033);
    box-shadow: 0 30px 90px rgba(0,0,0,.7);
  }
  .lb .frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 40% at 70% 15%, rgba(232,121,249,.35), transparent 70%); }
  .lb .frame img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 98%; }
  .lb .lbx {
    position: absolute; top: 18px; right: 18px; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.35); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .lb .lbx .ic { width: 16px; height: 16px; }
  .lb .lbnav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.35); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .lb .lbnav:hover { background: rgba(217,70,239,.35); }
  .lb .lbnav.prev { left: 24px; }
  .lb .lbnav.next { right: 24px; }
  .lb .lbnav .ic { width: 18px; height: 18px; }
  .lb .lbnav[hidden], .lb .lbcnt[hidden] { display: none; }
  .lb .lbcnt {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    color: #fff; font-weight: 700; font-size: .88rem;
    background: rgba(0,0,0,.42); border-radius: 999px; padding: 6px 14px;
  }
  .lb .frame img.blurred { filter: blur(26px) brightness(.6); }
  .lb .vov {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 11px;
  }
  .lb .vov .plc {
    width: 60px; height: 60px; border-radius: 50%; cursor: pointer;
    background: rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .lb .vov .plc .ic { width: 22px; height: 22px; }
  .lb .vov small { font-size: .88rem; font-weight: 700; color: #fff; }
  .lb .vov .btn { padding: .55rem 1.2rem; font-size: .85rem; }

  .toast {
    position: fixed; bottom: 92px; left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #1e1b22; border: 1px solid rgba(217,70,239,.45);
    border-radius: 12px; padding: 12px 18px;
    font-size: .9rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .25s;
    z-index: 95; box-shadow: 0 14px 40px rgba(0,0,0,.55);
    max-width: min(92vw, 500px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast b { color: #f0abfc; }

  @media (max-width: 1280px) { .cp { display: none; } }
  @media (max-width: 1000px) { .cl { display: none; } }

  /* ============ чипы действий внутри композера ============ */
  .qchip {
    display: flex; align-items: center; gap: 6px; cursor: pointer; font-family: inherit;
    border: 1px solid rgba(255,255,255,.13); border-radius: 999px;
    background: rgba(255,255,255,.04); color: #fff;
    font-size: .78rem; font-weight: 700; padding: 6.5px 12px; flex: none;
    transition: border-color .15s, background .15s;
  }
  .qchip:hover { border-color: rgba(217,70,239,.55); background: rgba(217,70,239,.12); }
  .qchip .ic { width: 14px; height: 14px; color: #e879f9; }
  .qchip.on {
    background: linear-gradient(120deg, rgba(217,70,239,.28), rgba(244,63,94,.28));
    border-color: rgba(217,70,239,.65);
    box-shadow: 0 0 14px rgba(217,70,239,.3);
  }
  .qchip.on .ic { color: #fff; }
  .qchip .qvip {
    font-size: .6rem; font-weight: 800; color: #fff;
    background: linear-gradient(90deg, #f59e0b, #f43f5e);
    border-radius: 999px; padding: 1.5px 7px;
  }
  /* на тарифе VIP плашки «VIP» не показываются — фичи уже доступны */
  body[data-tier="vip"] .qchip .qvip,
  body[data-tier="vip"] .icbtn .viptag { display: none; }
  /* на Free медиа-запросы под замком (генерация фото и аудио — фичи подписки), баланса нет */
  .qchip .qlock { display: none; width: 12px; height: 12px; color: #fbbf24; }
  body[data-tier="free"] .qchip .qlock { display: block; }
  body[data-tier="free"] .balance { display: none; }
</style>

];

let cur = null;          // текущий бот

/* ---------- список чатов ---------- */
function avaHtml(b) {
  if (b.img) return `<div class="ava"><div class="ph"><img src="${b.img}" alt=""></div><i class="dot"></i></div>`;
  if (b.isbot) return `<div class="ava pinkbot"><span class="init"><svg class="ic"><use href="#i-bot"/></svg></span><i class="dot"></i></div>`;
  return `<div class="ava"><span class="init">${b.init || '•'}</span><i class="dot"></i></div>`;
}
function prevText(b) {
  const last = [...b.msgs].reverse().find(m => m.from);
  if (!last) return '';
  if (last.kind === 'text') return last.text.replace(/\*[^*]*\*\s*/g, '');
  if (last.kind === 'photo') return '📷 Фото';
  if (last.kind === 'voice') return '🎤 Голосовое';
  if (last.kind === 'video') return '🎬 Видео';
  if (last.kind === 'req') return (last.req === 'photo' ? '📷 ' : '🎤 ') + last.text;
  return 'Сообщение';
}
function renderList() {
  $('#cllist').innerHTML = LIST.map(li => {
    const b = BOTS[li.id];
    return `<div class="ci ${cur && li.id === cur.id ? 'on' : ''}" data-id="${li.id}" data-name="${b.name.toLowerCase()}">
      ${avaHtml(b)}
      <div class="ci-mid">
        <div class="ci-r1"><b>${b.name}</b><small>${li.t}</small></div>
        <div class="ci-r2"><p>${esc(prevText(b))}</p>${li.unr ? `<span class="unr">${li.unr}</span>` : ''}</div>
      </div>
    </div>`;
  }).join('');
}
$('#cllist').addEventListener('click', e => {

});
$('#clq').addEventListener('input', e => {

});

/* ---------- сообщения ---------- */
function msgNode(m) {
  if (m.dv) { const d = document.createElement('div'); d.className = 'dv'; d.textContent = m.dv; return d; }
  const el = document.createElement('div');
  el.className = `m ${m.from}`;
  const t = m.time || nowT();

  if (m.kind === 'text') {
    el.innerHTML = `<div class="bub">${md(m.text)}</div>
      <div class="meta"><span>${t}</span></div>`;
  }
  if (m.kind === 'req') {
    const r = REQ[m.req];
    el.innerHTML = `<div class="bub">
        <div class="reqhead"><svg class="ic"><use href="#${r.icon}"/></svg> ${r.label} · ${r.price} ${gemI}</div>
        ${md(m.text)}
      </div><div class="meta"><span>${t}</span></div>`;
  }
  if (m.kind === 'photo') {
    const box = m.img
      ? `<div class="phbox" data-lb="${m.img}"><img src="${m.img}" alt=""></div>`
      : `<div class="phbox noimg"><svg class="phn"><use href="#i-img"/></svg></div>`;
    el.innerHTML = `<div class="bub mph">
        ${box}
        ${m.cap ? `<div class="cap">${md(m.cap)}</div>` : ''}
      </div><div class="meta"><span>${t}</span></div>`;
  }
  if (m.kind === 'video') {
    const locked = TIER !== 'vip';
    el.innerHTML = `<div class="bub mvid">
        <div class="vidbox ${locked ? '' : 'unlocked'}" data-vip>
          ${m.img ? `<img src="${m.img}" alt="">` : ''}
          ${locked
            ? `<span class="vtag">VIP</span><div class="lockc"><span class="plc"><svg class="ic"><use href="#i-lock"/></svg></span><small>Видео доступно на VIP</small></div>`
            : `<div class="lockc"><span class="plc"><svg class="ic"><use href="#i-play"/></svg></span></div>`}
          <span class="vdur">${m.dur}</span>
        </div>
      </div><div class="meta"><span>${t}</span></div>`;
  }
  if (m.kind === 'voice') {
    const bars = Array.from({ length: 27 }, (_, i) =>
      `<i style="height:${5 + Math.round(11 * Math.abs(Math.sin(i * 1.7 + 1)) + 8 * Math.abs(Math.sin(i * .55)))}px"></i>`).join('');
    el.innerHTML = `<div class="bub">
        <div class="vc">
          <button class="pl" data-dur="${m.dur}"><svg class="ic"><use href="#i-play"/></svg></button>
          <span class="bars">${bars}</span><span class="dur">0:${String(m.dur).padStart(2, '0')}</span>
        </div>
      </div><div class="meta"><span>${t}</span></div>`;
  }
  if (m.kind === 'err') {
    el.className = 'm bot';
    el.innerHTML = `<div class="bub errb"><div class="er">
        <svg class="ic"><use href="#i-warn"/></svg>
        <div><b>Не получилось ответить</b><p>Сбой на нашей стороне — 12 токенов вернулись на баланс.</p>
        <button class="btn btn-outline" data-retry>Повторить</button></div>
      </div></div><div class="meta"><span>${t}</span></div>`;
  }
  return el;
}

function nowT() { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
const feed = $('#feed');
function scrollFeed() { feed.scrollTop = feed.scrollHeight; }

function addMsg(m, silent) {
  cur.msgs.push(m);
  // медиа из диалога пополняют сетку «Медиа чата» в профиле
  if (m.from === 'bot' && (m.kind === 'photo' || m.kind === 'video') && m.img) {
    cur.media.unshift({ t: m.kind, img: m.img });
    renderProfile();
  }
  feed.appendChild(msgNode(m));
  if (!silent) scrollFeed();
  renderList();
}

function typing(ms, cb) {
  const el = document.createElement('div');
  el.className = 'm bot typing';
  el.innerHTML = '<div class="bub"><i></i><i></i><i></i></div>';
  feed.appendChild(el); scrollFeed();
  setTimeout(() => { el.remove(); cb(); }, ms);
}

function botReply(text) {
  typing(1300 + Math.random() * 700, () => {
    addMsg({ from: 'bot', kind: 'text', text, time: nowT() });
  });
}

/* блок сценариев в пустом чате */
function scenBlock() {
  const el = document.createElement('div');
  el.className = 'scen'; el.id = 'scenblock';
  el.innerHTML = `
    <h4>С чего начнём?</h4>
    <div class="s">Выберите ситуацию — диалог запустится сразу</div>
    <div class="stabs">
      <button class="on" data-t="usual">Обычные</button>
      <button class="sp" data-t="spicy">🌶 Spicy${TIER === 'free' ? ' 🔒' : ''}</button>
    </div>
    <div class="sgrid">${scenCards('usual')}</div>`;
  return el;
}
function peps() {
  return [12, 34, 55, 74, 90].map((l, i) =>
    `<i class="pep" style="left:${l}%;--pd:${(1.2 + i * .22).toFixed(2)}s;--pdel:${(i * .27).toFixed(2)}s">🌶</i>`).join('');
}
function scenCards(tab) {
  const lk = tab === 'spicy' && TIER === 'free';
  return SCEN[tab].map(([t, d]) =>
    `<button class="scn ${tab === 'spicy' ? 'sp' : ''} ${lk ? 'lk' : ''}" data-scn="${t}" ${lk ? 'data-lk="1"' : ''}>
       ${tab === 'spicy' && !lk ? peps() : ''}
       <b>${t} <svg class="ic ${lk ? 'lki' : ''}"><use href="#${lk ? 'i-lock' : 'i-chevr'}"/></svg></b><p>${d}</p>
     </button>`).join('');
}

/* ---------- открытие чата ---------- */
function openChat(id) {
  cur = BOTS[id];
  poolIdx = 0;

  // шапка
  const inner = cur.img
    ? `<div class="ph"><img src="${cur.img}" alt=""></div>`
    : cur.isbot
      ? `<span class="init"><svg class="ic"><use href="#i-bot"/></svg></span>`
      : `<span class="init">${cur.init}</span>`;
  $('#h-ava').outerHTML = `<div class="ava ${cur.isbot ? 'pinkbot' : ''}" id="h-ava">${inner}<i class="dot"></i></div>`;
  $('#h-name').textContent = `${cur.name}, ${cur.age}`;

/* ---------- режим общения ---------- */
function setMode(m, silent) {
  cur.mode = m;
  $('#cc').dataset.mode = m;
  $$('#mseg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  if (!silent) {

}
$('#mseg').addEventListener('click', e => {

/* ---------- профиль ---------- */
function renderProfile() {
  const b = cur;
  const facts = b.facts.map(([k, v]) => `
    <div class="fact">
      <span class="fi"><svg class="ic"><use href="#${FICONS[k] || 'i-spark'}"/></svg></span>
      <span><small>${k}</small><b>${v}</b></span>

    media = `<div class="mempty">Фото и видео из диалога появятся здесь</div>`;
  } else if (M.length <= 3) {
    media = `<div class="mgrid">${M.map((m, i) => miTile(m, i)).join('')}</div>`;
  } else {
    media = `<div class="mgrid">${M.slice(0, 2).map((m, i) => miTile(m, i)).join('')}

    ? `<button class="btn btn-outline" data-act="regen"><svg class="ic" style="width:15px;height:15px"><use href="#i-refresh"/></svg> Перегенерировать профиль</button>
       <button class="btn btn-outline" data-act="edit"><svg class="ic" style="width:15px;height:15px"><use href="#i-edit"/></svg> Редактировать</button>`
    : `<button class="btn btn-outline" data-act="profile"><svg class="ic" style="width:15px;height:15px"><use href="#i-user"/></svg> Профиль</button>`;

  const photo = b.img
    ? `<div class="cp-photo" data-lb="${b.img}"><img src="${b.img}" alt=""></div>`
    : `<div class="cp-photo ph-init ${b.isbot ? 'pinkbg' : ''}">${b.isbot ? '<svg class="big"><use href="#i-bot"/></svg>' : `<span>${b.init}</span>`}</div>`;

      ${b.author ? `<div class="cp-author"><span class="cp-au-ava">${b.author.nick[0].toUpperCase()}</span><span class="cp-au-txt"><span class="cp-au-top"><a data-act="author">@${b.author.nick}</a>${b.author.verified ? '<svg class="cp-ver"><use href="#i-verified"/></svg>' : ''}</span><span class="cp-au-role">автор</span></span><button class="cp-au-sub" data-act="follow">Подписаться</button></div>` : ''}
      <div class="cp-sec">Обо мне</div>

    </div>`;

  const bio = $('#bio'), more = $('#biomore');

  if (sub) sub.addEventListener('click', () => {
    const on = sub.classList.toggle('on');

    toast(on ? 'Вы подписались на <b>@' + b.author.nick + '</b>' : 'Вы отписались от <b>@' + b.author.nick + '</b>');
  });
  $$('#cp [data-act]').forEach(btn => btn.addEventListener('click', () => {
    const a = btn.dataset.act;
    if (a === 'regen') toast('Демо: перегенерация профиля бота');
    if (a === 'edit') toast('Демо: редактор персонажа');
    if (a === 'profile') toast('Демо: переход в профиль бота');
    if (a === 'author') toast('Демо: переход на страницу автора');

}

/* ---------- отправка ---------- */
const ta = $('#msg');
function autoSize() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 150) + 'px'; }
ta.addEventListener('input', () => {
  autoSize();
  const n = ta.value.length, c = $('#cnt');
  c.textContent = `${n}/1000`;
  c.classList.toggle('warn', n >= 800);
  c.classList.toggle('max', n >= 1000);
});
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('#sendbtn').addEventListener('click', send);

function send() {
  const v = ta.value.trim();
  if (reqMode === 'video') { sendReq('video', reqPreset); return; }
  if (!v) return;
  if (reqMode) { sendReq(reqMode, v); return; }
  ta.value = ''; autoSize(); $('#cnt').classList.remove('warn');
  startDialog();
  addMsg({ from: 'me', kind: 'text', text: v, time: nowT() });
  const pool = POOL[cur.mode];
  botReply(pool[poolIdx++ % pool.length]);
}

/* ---------- режим запроса медиа (описание в инпуте, цена — в кнопке отправки) ---------- */
let reqMode = null;
let reqPreset = null;
const SEND_BASE = '<svg class="ic"><use href="#i-send"/></svg>';
function startReq(kind) {
  cancelReq();
  reqMode = kind;
  const r = REQ[kind];
  const sb = $('#sendbtn');
  sb.classList.add('pricey');
  sb.innerHTML = `${SEND_BASE}<span class="sp">${r.price} ${gemI}</span>`;
  sb.title = `Отправить запрос — спишется ${r.price} токенов`;
  document.querySelector(`.qchip[data-q="${kind}"]`)?.classList.add('on');
  ta.placeholder = r.ph;
  ta.focus();
}
function cancelReq() {
  reqMode = null; reqPreset = null;
  $$('.qchip.on').forEach(b => b.classList.remove('on'));
  const sb = $('#sendbtn');
  sb.classList.remove('pricey');
  sb.innerHTML = SEND_BASE;
  sb.title = 'Отправить';
  ta.placeholder = 'Сообщение…';
}

function sendReq(kind, text) {
  const r = REQ[kind];
  if (balance < r.price) { paywallTokens(r.price); return; }
  ta.value = ''; autoSize(); $('#cnt').classList.remove('warn');
  cancelReq();
  startDialog();
  addMsg({ from: 'me', kind: 'req', req: kind, text: kind === 'video' ? `Пресет: ${text}` : text, time: nowT() });
  typing(kind === 'voice' ? 2100 : kind === 'video' ? 2400 : 1900, () => {
    if (kind === 'photo') addMsg({ from: 'bot', kind: 'photo', img: cur.img, cap: CAPS[poolIdx++ % CAPS.length], time: nowT() });
    else if (kind === 'voice') addMsg({ from: 'bot', kind: 'voice', dur: 10, time: nowT() });
    else addMsg({ from: 'bot', kind: 'video', img: cur.img, dur: '0:15', time: nowT() });
    charge(r.price, r.why);
  });
}

/* ---------- сценарии ---------- */
document.addEventListener('click', e => {

  const tab = e.target.closest('.stabs button');
  if (tab) {
    const wrap = tab.closest('.stabs');
    wrap.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === tab));
    const listEl = wrap.parentElement.querySelector('.sgrid') || $('#zaplist');

  // выбор сценария

    startDialog();
    const d = document.createElement('div');
    d.className = 'dv'; d.textContent = `Сценарий: ${name}`;
    feed.appendChild(d); scrollFeed();
    typing(1400, () => addMsg({ from: 'bot', kind: 'text', text: INTRO[name], time: nowT() }));

});

      <button class="btn btn-grad" data-pw-go>Перейти на VIP</button>
      <button class="btn btn-ghost" data-pw-x>Позже</button>
    </div>`;
  feed.appendChild(el); scrollFeed();
  el.querySelector('[data-pw-go]').addEventListener('click', () => toast('Демо: чекаут VIP · <b>точка входа: чат, VIP-гейт</b>'));
  el.querySelector('[data-pw-x]').addEventListener('click', () => el.remove());
}

/* ---------- интерактив ленты ---------- */
feed.addEventListener('click', e => {
  // повтор после ошибки
  const rt = e.target.closest('[data-retry]');
  if (rt) {
    const m = rt.closest('.m');
    m.remove();
    cur.msgs = cur.msgs.filter(x => x.kind !== 'err');
    const pool = POOL[cur.mode];
    botReply(pool[poolIdx++ % pool.length]);
    return;
  }
  // голосовое
  const pl = e.target.closest('.vc .pl');
  if (pl) { playVoice(pl); return; }
  // видео (VIP)
  const vd = e.target.closest('[data-vip]');
  if (vd) {
    if (TIER === 'vip') toast('Демо: воспроизведение видео');
    else paywall('Видео от компаньона', 'Смотреть видео компаньонов можно на тарифе VIP.');
    return;
  }
  // лайтбокс
  const lbEl = e.target.closest('[data-lb]');
  if (lbEl) openLb(lbEl.dataset.lb);
});

function playVoice(pl) {
  if (pl.dataset.playing) return;
  pl.dataset.playing = '1';
  const dur = +pl.dataset.dur;
  const bars = [...pl.parentElement.querySelectorAll('.bars i')];
  const durEl = pl.parentElement.querySelector('.dur');
  const use = pl.querySelector('use');
  use.setAttribute('href', '#i-pause');
  let s = 0;
  const step = dur * 1000 / bars.length;
  const int = setInterval(() => {
    const filled = Math.floor((s / (dur * 10)) * bars.length);
    bars.forEach((b, i) => b.classList.toggle('f', i <= filled));
    if (s % 10 === 0) durEl.textContent = `0:${String(s / 10).padStart(2, '0')}`;
    s++;
    if (s > dur * 10) {
      clearInterval(int);
      delete pl.dataset.playing;
      use.setAttribute('href', '#i-play');
      durEl.textContent = `0:${String(dur).padStart(2, '0')}`;
      bars.forEach(b => b.classList.remove('f'));
    }
  }, 100);
}

/* ---------- просмотрщик медиа (галерея) ---------- */
let gal = [], galIdx = 0;

function miTile(m, i) {
  return `<button class="mi" data-mi="${i}">${m.img ? `<img src="${m.img}" alt="">` : ''}${m.t === 'video'
    ? `<span class="vplay"><svg class="ic"><use href="#${TIER === 'vip' ? 'i-play' : 'i-lock'}"/></svg></span>` : ''}</button>`;
}

function openViewer(list, i) {
  gal = list; galIdx = i;
  renderViewer();
  $('#lb').classList.add('open');
}
function renderViewer() {
  const m = gal[galIdx];
  const multi = gal.length > 1;
  $('#lbcnt').hidden = !multi;
  $('#lbprev').hidden = !multi;
  $('#lbnext').hidden = !multi;
  if (multi) $('#lbcnt').textContent = `${galIdx + 1} / ${gal.length}`;
  const vip = TIER === 'vip';
  $('#lbframe').innerHTML = m.t === 'video'
    ? `<img src="${m.img}" class="blurred" alt="">
       <div class="vov">
         <span class="plc" data-vplay><svg class="ic"><use href="#${vip ? 'i-play' : 'i-lock'}"/></svg></span>
         ${vip ? '<small>0:15</small>' : '<small>Видео доступно на VIP</small><button class="btn btn-grad" data-vgo>Перейти на VIP</button>'}
       </div>`
    : `<img src="${m.img}" alt="">`;
}
function navViewer(d) {
  if (gal.length < 2) return;
  galIdx = (galIdx + d + gal.length) % gal.length;
  renderViewer();
}
function openLb(src) { openViewer([{ t: 'photo', img: src }], 0); }

$('#lb').addEventListener('click', e => {
  if (e.target.closest('#lbprev')) { navViewer(-1); return; }
  if (e.target.closest('#lbnext')) { navViewer(1); return; }
  if (e.target.closest('[data-vgo]')) { toast('Демо: чекаут VIP · <b>точка входа: медиа, VIP-гейт</b>'); return; }
  if (e.target.closest('[data-vplay]')) {
    toast(TIER === 'vip' ? 'Демо: воспроизведение видео' : 'Смотреть видео компаньонов можно на тарифе VIP');
    return;
  }
  if (e.target.closest('.frame')) return;
  $('#lb').classList.remove('open');
});
window.addEventListener('keydown', e => {
  if (!$('#lb').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') navViewer(-1);
  if (e.key === 'ArrowRight') navViewer(1);
});

/* «Все медиа» */
function openMall() {
  $('#mallh').textContent = `Медиа чата · ${cur.media.length}`;
  $('#mallgrid').innerHTML = cur.media.map((m, i) => miTile(m, i)).join('');
  $('#mall').classList.add('open');
}
$('#mall').addEventListener('click', e => {
  const t = e.target.closest('[data-mi]');
  if (t) { openViewer(cur.media, +t.dataset.mi); return; }
  if (e.target.closest('#mallx') || !e.target.closest('.mall-p')) $('#mall').classList.remove('open');
});

/* клики по профилю: миниатюры, «+N», фото бота */
$('#cp').addEventListener('click', e => {
  const mi = e.target.closest('[data-mi]');
  if (mi) { openViewer(cur.media, +mi.dataset.mi); return; }
  if (e.target.closest('[data-mall]')) { openMall(); return; }
  const lbEl = e.target.closest('[data-lb]');
  if (lbEl) openLb(lbEl.dataset.lb);
});

/* ---------- прочее ---------- */
$('#tierbtn').addEventListener('click', () => {
  TIER = TIERS[(TIERS.indexOf(TIER) + 1) % TIERS.length];
  document.body.dataset.tier = TIER;
  $('#tierlabel').textContent = TIER_LABEL[TIER];
  $('#callbtn').title = TIER === 'vip' ? 'Аудиозвонок' : 'Аудиозвонок — фича VIP';
  cancelReq();
  $('#mall').classList.remove('open');
  $('#lb').classList.remove('open');
  openChat(cur.id);
  toast(`Демо: тариф <b>${TIER.toUpperCase()}</b> — замки и гейты обновились`);
});
$('#bellbtn').addEventListener('click', () => toast('Центр уведомлений — раздел <b>notifications</b> этого проекта'));
$('.cl-new').addEventListener('click', () => toast('Демо: создание нового чата (каталог)'));

/* старт */
renderList();
openChat('alex');
setTimeout(() => toast('Кнопка тарифа в топбаре — демо-переключатель: клик циклит <b>VIP → Free → Premium</b>, меняя замки и гейты'), 1500);
</script>
<script>
/* V5: чипы панели действий (кнопки у инпута скрыты, сценарии без дубля) */
document.getElementById('quickbar').addEventListener('click', e => {
  const c = e.target.closest('.qchip');
  if (!c) return;
  e.stopPropagation();

      paywallSub(q === 'photo' ? 'Фото от компаньона — в подписке' : 'Голосовые сообщения — в подписке',
        'Генерация фото и голосовых доступна на Premium и VIP — вместе с токенами каждый месяц.', 'медиа-гейт Free');
      return;
    }
    reqMode === q ? cancelReq() : startReq(q);
    return;
  }
  if (q === 'video') {
    if (TIER !== 'vip') { startDialog(); paywall('Видео от компаньона', 'Короткие видео умеют записывать только компаньоны VIP-подписчиков.'); return; }
    const pv = document.getElementById('pop-video');
    const wasV = pv.classList.contains('open');
    closePops();

    });
    document.getElementById('zaplist').innerHTML = zapItems('usual');
    p.classList.add('open');
  }
});
