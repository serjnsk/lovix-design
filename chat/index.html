<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lovix — Чат: варианты 1 и 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: "Mulish", ui-sans-serif, system-ui, sans-serif; background: #161418; overflow: hidden; }

  .stage { position: absolute; inset: 0; z-index: 2; }
  .stage iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .stage iframe.on { opacity: 1; pointer-events: auto; }

  .loadhint {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    color: #6b6577; font-size: .95rem; font-weight: 600;
  }

  /* плавающий бар выбора варианта — сверху по центру */
  .vbar {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 60;
    display: flex; align-items: center; gap: 5px;
    background: rgba(13,11,16,.88); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.15); border-radius: 999px;
    padding: 6px 8px;
    box-shadow: 0 16px 50px rgba(0,0,0,.6);
  }
  .vbar button {
    width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
    background: transparent; color: #a79fb3;
    font-family: inherit; font-weight: 800; font-size: .92rem;
  }
  .vbar button:hover { background: rgba(255,255,255,.1); color: #fff; }
  .vbar button.on {
    background: linear-gradient(120deg, #d946ef, #f43f5e);
    color: #fff; box-shadow: 0 4px 16px rgba(217,70,239,.45);
  }
  .vbar .lbl {
    min-width: 168px; text-align: center;
    color: #fff; font-weight: 700; font-size: .84rem;
    padding: 0 8px; white-space: nowrap;
  }
  .vbar .keys { color: #6b6577; font-size: .72rem; font-weight: 600; padding-right: 8px; white-space: nowrap; }
</style>
</head>
<body>

<div class="loadhint">Загрузка варианта…</div>

<div class="stage" id="stage">
  <iframe data-src="v1.html" title="V1"></iframe>
  <iframe data-src="v5.html" title="V5"></iframe>
</div>

<div class="vbar" id="vbar">
  <button data-v="1">1</button>
  <button data-v="5">5</button>
  <span class="lbl" id="vlbl"></span>
  <span class="keys">1 / 5 / ← →</span>
</div>

<script>
const VARS = [1, 5];
const NAMES = {
  1: 'Амбиент — «Фото» + шеврон у инпута',
  5: 'Панель действий — чипы над инпутом',
};
const frames = [...document.querySelectorAll('.stage iframe')];
const btns = [...document.querySelectorAll('.vbar button')];
let curV = 0;

function show(v) {
  if (!VARS.includes(v) || v === curV) return;
  curV = v;
  const idx = VARS.indexOf(v);
  frames.forEach((f, i) => {
    if (i === idx && !f.src) f.src = f.dataset.src;
    f.classList.toggle('on', i === idx);
  });
  btns.forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  document.getElementById('vlbl').textContent = NAMES[v];
  history.replaceState(null, '', '#v' + v);
}

document.getElementById('vbar').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) show(+b.dataset.v);
});
window.addEventListener('keydown', e => {
  if (e.key === '1' || e.key === '5') show(+e.key);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') show(VARS[(VARS.indexOf(curV) + 1) % 2]);
});

const h = +(location.hash.match(/^#v([15])$/)?.[1] || 1);
show(VARS.includes(h) ? h : 1);
</script>
</body>
</html>
