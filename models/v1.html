<style>
  /* ── «Мои компаньоны»: статусы публикации. Классы с префиксами my-/cc-, общие стили не трогаются ── */

  .content { max-width: 1240px; }

  .my-head { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .my-head .sub { max-width: 60ch; }
  .my-head .btn { margin-left: auto; flex: none; }

  .my-bar { margin: 28px 0 22px; }
  /* вкладок пять, а не три как на тарифах — уменьшаем локально,
     ровно как это сделано для сегмента внутри чекаута (.ck .seg button) */
  .my-bar .seg button { padding: .46rem .85rem; font-size: .85rem; gap: .4rem; }
  /* счётчик в сегменте — по образцу .off (пилюля скидки) из общих стилей */
  .seg .cnt {
    font-size: .72rem; font-weight: 800;
    padding: .16rem .45rem; border-radius: 999px;
    background: rgba(217,70,239,.16); color: #f0abfc;
  }
  .seg button.on .cnt { background: rgba(0,0,0,.28); color: #fff; }


  /* карточка компаньона — по макету Figma 5201:52203 (285×400, r12) */
  .cc {
    position: relative; overflow: hidden;
    border-radius: 12px;
    aspect-ratio: 285 / 400;
    display: flex; flex-direction: column; justify-content: flex-end;
    transition: transform .18s, box-shadow .18s;
    cursor: pointer;
  }
  .cc:hover { transform: translateY(-3px); box-shadow: 0 20px 48px rgba(217,70,239,.16); }
  .cc-bg { position: absolute; inset: 0; }
  .cc-img {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    height: 92%; width: auto; max-width: none;
    filter: drop-shadow(0 12px 26px rgba(0,0,0,.45));
  }
  /* градиент из макета: прозрачный → rgba(16,14,16,.92), высота 110 */
  .cc-shade {
    position: absolute; inset: auto 0 0 0; height: 110px;
    background: linear-gradient(180deg, rgba(16,14,16,0), rgba(16,14,16,.92));
  }
  .cc-meta {
    position: relative;
    padding: 0 16px 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .cc-text { display: flex; flex-direction: column; gap: 2px; }
  /* des/H/h3 semi — 24/28 */
  .cc-name {
    display: flex; align-items: center; gap: 6px;
    font-size: 24px; line-height: 28px; font-weight: 600; color: #fff;
    white-space: nowrap;
  }
  .cc-name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .cc-name span { opacity: .6; }
  /* des/S/s1 regu — 14/16 */
  .cc-desc {
    font-size: 14px; line-height: 16px; font-weight: 400; color: #fff; opacity: .62;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cc-foot { display: flex; align-items: center; gap: 12px; padding: 2px 0; }
  .cc-m {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 14px; font-weight: 400; color: #fff; opacity: .9;
  }
  .cc-m.like { gap: 3px; }
  .cc-ic { width: 14px; height: 14px; flex: none; }


  /* статус публикации поверх карточки */
  /* плашка статуса — форма от .status с хаба проекта, начертание regular */
  .cc-badge {
    position: absolute; top: 10px; left: 10px; z-index: 2;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    font-size: .72rem; font-weight: 400;
    backdrop-filter: blur(6px);
  }
  .cc-badge .ic { width: 11px; height: 11px; }
  .st-pub  { background: rgba(22,101,52,.72); color: #86efac; }
  .st-mod  { background: rgba(120,72,12,.72); color: #fcd34d; }
  .st-rej  { background: rgba(127,29,29,.72); color: #fca5a5; }
  .st-priv { background: rgba(16,14,16,.7);   color: rgb(var(--muted)); }

  .cc-menu {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
    border: 0; background: rgba(16,14,16,.55); color: #fff;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .15s, background .15s;
  }
  .cc:hover .cc-menu { opacity: 1; }
  .cc-menu:hover { background: rgba(16,14,16,.85); }
  .cc-menu .ic { width: 16px; height: 16px; }

  /* причина отказа — подсказкой по наведению на статус (компонент .tip из общих стилей) */
  .cc-tip { position: absolute; top: 10px; left: 10px; z-index: 3; }
  .cc-tip .cc-badge { position: static; cursor: help; }
  .cc-tip .bubble {
    top: 100%; bottom: auto; left: 0; transform: none;
    width: 216px;
    border-top: 8px solid transparent; background-clip: padding-box;
  }
  .cc-tip .bubble b { display: block; color: #fca5a5; font-size: .74rem; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 5px; }

  /* меню действий — компонент .pop / .pi со страницы чата */
  .my-cell { position: relative; }
  .pop {
    position: absolute; top: 46px; right: 8px; width: 244px;
    background: #1c1722; border: 1px solid rgba(255,255,255,.12); border-radius: 15px;
    padding: 8px; box-shadow: 0 18px 55px rgba(0,0,0,.6);
    display: none; z-index: 40;
  }
  .pop.open { display: block; }
  .pi {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 10px 11px; border-radius: 10px; border: 0; background: none;
    color: #fff; cursor: pointer; text-align: left; font-family: inherit;
    font-size: .88rem;
  }
  .pi:hover { background: rgba(255,255,255,.06); }
  .pi .ic { width: 17px; height: 17px; color: #e879f9; flex: none; }
  .pi.danger { color: #fca5a5; }
  .pi.danger .ic { color: #fca5a5; }
  .pi.danger:hover { background: rgba(239,68,68,.12); }
  .pop hr { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 5px 8px; }

  .my-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; align-items: start; }

  /* пустое состояние */
  .my-empty {
    text-align: center; padding: 64px 40px;
    background: rgba(255,255,255,.05); border-radius: 20px;
  }
  .my-empty .ibox {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
    background: rgba(255,255,255,.08); color: rgb(var(--muted));
    display: flex; align-items: center; justify-content: center;
  }
  .my-empty .ibox .ic { width: 24px; height: 24px; }
  .my-empty h3 { font-size: 1.15rem; font-weight: 800; }
  .my-empty p { color: rgb(var(--muted)); font-size: .92rem; margin: 8px auto 18px; max-width: 44ch; }

  @media (max-width: 900px) { .my-head .btn { margin-left: 0; width: 100%; } }
  @media (max-width: 560px) { .my-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
</style>

    'linear-gradient(160deg, #2a5e4a, #2d8b6b)',
    'linear-gradient(160deg, #4a2a5e, #8b2d7b)',
    'linear-gradient(160deg, #2a4a5e, #2d5b8b)',
    'linear-gradient(160deg, #5e2a2a, #8b3d2d)'
  ];

  // кадрировка и тон: два исходных выреза, но разная крупность и подача — карточки не выглядят одинаковыми
  const FRAME = [
    { h: '92%',  b: '0',     f: 'saturate(1.02) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '126%', b: '-6%',   f: 'saturate(.94) brightness(1.04) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '104%', b: '-2%',   f: 'saturate(1.08) contrast(1.04) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '138%', b: '-14%',  f: 'saturate(.9) brightness(1.02) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '88%',  b: '0',     f: 'saturate(1.05) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '116%', b: '-5%',   f: 'saturate(.96) contrast(1.05) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '98%',  b: '-1%',   f: 'saturate(1.1) brightness(.98) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '132%', b: '-10%',  f: 'saturate(.92) drop-shadow(0 12px 26px rgba(0,0,0,.45))' },
    { h: '110%', b: '-3%',   f: 'saturate(1.04) contrast(1.02) drop-shadow(0 12px 26px rgba(0,0,0,.45))' }
  ];

  const TABS = [
    ['all', 'Все'], ['priv', 'Приватные'], ['mod', 'На модерации'],
    ['pub', 'Опубликованы'], ['rej', 'Отклонены'],
  ];
  let active = 'all';

  const countOf = k => k === 'all' ? BOTS.length : BOTS.filter(b => b[3] === k).length;

  function drawSeg() {
    document.getElementById('seg').innerHTML = TABS.map(([k, label]) =>
      `<button data-k="${k}" class="${k === active ? 'on' : ''}">${label}<span class="cnt">${countOf(k)}</span></button>`
    ).join('');
  }

  function cardHtml(b, i) {
    const [name, age, desc, st, talks, rate, reason] = b;
    const s = ST[st];
    const f = FRAME[i % FRAME.length];
    return `<div class="my-cell">
      <article class="cc">
        <div class="cc-bg" style="background:${BG[i % BG.length]}"></div>
        <img class="cc-img" src="../assets/img/model-${(i % 2) + 1}.webp" alt="${name}"
             style="height:${f.h}; bottom:${f.b}; filter:${f.f}">
        <div class="cc-shade"></div>
        ${reason
          ? `<span class="tip cc-tip"><span class="cc-badge ${s.cls}"><svg class="ic"><use href="#${s.icon}"/></svg>${s.label}</span>
               <span class="bubble"><b>Причина отказа</b>${reason}</span></span>`
          : `<span class="cc-badge ${s.cls}"><svg class="ic"><use href="#${s.icon}"/></svg>${s.label}</span>`}
        <button class="cc-menu" data-menu="${i}" aria-label="Действия"><svg class="ic"><use href="#i-dots"/></svg></button>
        <div class="cc-meta">
          <div class="cc-text">
            <div class="cc-name"><b>${name},</b><span>${age}</span></div>
            <p class="cc-desc">${desc}</p>
          </div>
          <div class="cc-foot">
            <span class="cc-m"><svg class="cc-ic"><use href="#i-cc-chat"/></svg>${talks}</span>
            <span class="cc-m like"><svg class="cc-ic"><use href="#i-cc-like"/></svg>${rate}</span>
          </div>
        </div>
      </article>
      <div class="pop" data-pop="${i}">
        ${ACTIONS[st].map(([ic, label]) => `<button class="pi"><svg class="ic"><use href="#${ic}"/></svg>${label}</button>`).join('')}
        ${ACTIONS[st].length ? '<hr>' : ''}
        <button class="pi danger"><svg class="ic"><use href="#i-trash"/></svg>Удалить навсегда</button>
      </div>
    </div>`;
  }

  function render() {
    const list = BOTS.map((b, i) => [b, i]).filter(([b]) => active === 'all' || b[3] === active);
    const grid = document.getElementById('grid');
    grid.innerHTML = list.length
      ? list.map(([b, i]) => cardHtml(b, i)).join('')
      : `<div class="my-empty" style="grid-column:1/-1">
           <div class="ibox"><svg class="ic"><use href="#i-users"/></svg></div>
           <h3>Здесь пока пусто</h3>
           <p>В этом разделе нет компаньонов с таким статусом.</p>
           <button class="btn btn-grad">Создать компаньона</button>
         </div>`;
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-menu]');
    const open = document.querySelector('.pop.open');
    if (open && (!btn || open.dataset.pop !== btn.dataset.menu)) open.classList.remove('open');
    if (btn) document.querySelector(`.pop[data-pop="${btn.dataset.menu}"]`)?.classList.toggle('open');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.querySelector('.pop.open')?.classList.remove('open');
  });

  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]');
    if (!b) return;
    active = b.dataset.k;
    drawSeg(); render();
  });

  drawSeg(); render();
</script>

</body>
</html>
