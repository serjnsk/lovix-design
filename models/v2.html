<title>Lovix — Мои ИИ-компаньоны · с вкладкой «Избранное»</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lovix.css">
<style>
  /* ── «Мои ИИ-компаньоны»: текущая продовая страница lovix.ai + вкладка «Избранное».
       Всё, кроме вкладок и содержимого «Избранного», повторяет прод: заголовок,
       подзаголовок, кнопка «Создать модель», карточка модели с чипами и корзиной,
       плитка «+ Создать модель». Классы с префиксами my-/cc-, общие стили не трогаются.
       Черновик с статусами публикации (фича авторов) — models/v1.html. ── */

  .content { max-width: 1240px; }

  /* фон и хром — залогиненное состояние, как на проде этой страницы */
  body { background: linear-gradient(to bottom right, rgb(var(--page-from)) 0%, rgb(var(--page)) 60%); }
  .page { background: none; }
  .sb-item.on { background: rgba(255,255,255,.08); }         /* активный пункт — тихая подложка */
  .sb-item.cta { background: linear-gradient(90deg, rgb(var(--acc-from)), rgb(var(--acc-to))); color: #fff; }
  .sb-item.cta .ic { color: #fff; }
  .sb-cnt {
    margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: linear-gradient(90deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    color: #fff; font-size: .7rem; font-weight: 800; font-style: normal;
    display: flex; align-items: center; justify-content: center;
  }

  .my-head { display: flex; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .my-head .sub { max-width: 60ch; }
  .my-head .btn { margin-left: auto; flex: none; }

  /* вкладки: «Мои модели» / «Избранное» — сегмент из общих стилей, счётчики по образцу .off */
  .my-bar { margin: 26px 0 22px; }
  .my-bar .seg button { gap: .45rem; }
  .my-bar .seg .ic { width: 15px; height: 15px; }
  .seg .cnt {
    font-size: .72rem; font-weight: 800;
    padding: .16rem .45rem; border-radius: 999px;
    background: rgba(217,70,239,.16); color: #f0abfc;
  }
  .seg button.on .cnt { background: rgba(0,0,0,.28); color: #fff; }

  .my-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; align-items: start; }

  /* карточка — по макету Figma 5201:52203 (285×400, r12) */
  /* Поведение при наведении — то же, что в каталоге на главной (assets/bot-card.js):
     класс is-active ставит скрипт по hover/focus — обводка + свечение, зум медиа,
     у карточек избранного играет видео. */
  .cc {
    position: relative; overflow: hidden;
    border-radius: 12px;
    aspect-ratio: 285 / 400;
    display: flex; flex-direction: column; justify-content: flex-end;
    transition: transform .2s, box-shadow .2s;
    cursor: pointer; outline: 0;
  }
  .cc-photo, .cc-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #1b171d;
    transition: transform .5s ease, opacity .25s ease;
  }
  .cc-video { opacity: 0; }
  .cc-video.is-visible { opacity: 1; }
  .cc::after {
    content: ""; position: absolute; inset: 0; z-index: 3; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1.5px rgba(217,70,239,.75), inset 0 0 44px rgba(217,70,239,.45);
    opacity: 0; transition: opacity .25s ease;
  }
  .cc.is-active { transform: translateY(-3px); box-shadow: 0 22px 50px rgba(217,70,239,.22); }
  .cc.is-active::after { opacity: 1; }
  .cc.is-active .cc-photo, .cc.is-active .cc-video, .cc.is-active .cc-img { transform: scale(1.04); }
  .cc.is-active .cc-img { transform: translateX(-50%) scale(1.04); }
  .cc-bg { position: absolute; inset: 0; }
  .cc-img {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    height: 96%; width: auto; max-width: none;
    filter: drop-shadow(0 12px 26px rgba(0,0,0,.45));
  }
  .cc-shade {
    position: absolute; inset: auto 0 0 0; height: 62%;
    background: linear-gradient(180deg, rgba(16,14,16,0) 0%, rgba(16,14,16,.45) 40%, rgba(16,14,16,.9) 100%);
  }
  .cc-meta { position: relative; padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .cc-text { display: flex; flex-direction: column; gap: 3px; }
  .cc-name {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 24px; line-height: 28px; font-weight: 600; color: #fff; white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 14px rgba(0,0,0,.45);
  }
  .cc-name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .cc-name span { opacity: .7; }
  .cc-desc {
    font-size: 14px; line-height: 17px; font-weight: 400; color: rgba(255,255,255,.85);
    text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 1px 10px rgba(0,0,0,.4);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .cc-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cc-m {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 9px; border-radius: 999px;
    background: rgba(16,14,16,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    font-size: 13px; font-weight: 500; color: #fff;
  }
  .cc-ic { width: 13px; height: 13px; flex: none; opacity: .9; }
  /* чипы своей модели — как на проде: «Модель №1» серый, «Активен» синий */
  .cc-m.st { background: rgba(37,99,235,.85); }

  /* корзина у своей модели — как на проде, сверху справа */
  .cc-del {
    position: absolute; top: 10px; right: 10px; z-index: 4;
    width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(16,14,16,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .15s;
  }
  .cc-del .ic { width: 15px; height: 15px; }
  .cc-del:hover { background: rgba(239,68,68,.75); transform: scale(1.08); }

  /* плитка «+ Создать модель» — как на проде: тихая панель, круг с плюсом, подпись */
  .cc.newtile {
    justify-content: center; align-items: center; gap: 12px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
    color: rgb(var(--muted));
  }
  .cc.newtile:hover { background: rgba(255,255,255,.07); box-shadow: none; }
  .cc.newtile .plus {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,.08); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .cc.newtile .plus .ic { width: 22px; height: 22px; }
  .cc.newtile .lbl { font-size: 14px; color: #d7d7e0; }

  /* ── вкладка «Избранное»: боты других авторов, отмеченные сердечком в каталоге.
       Источник — localStorage lovix.fav (индексы CATALOG_BOTS из assets/bots-data.js),
       тот же, что пишет главная. Карточка — как на главной: фото, бейдж автора,
       сердечко «убрать». ── */
  /* бейдж автора — как на главной: в покое только аватар, при наведении/фокусе раскрывается до «@ника» */
  .cc-auth {
    position: absolute; top: 10px; left: 10px; z-index: 4;
    display: inline-flex; align-items: center; gap: 0; height: 28px; padding: 3px; border-radius: 999px;
    background: rgba(16,14,16,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; text-decoration: none; outline: 0;
    transition: gap .2s ease, padding .2s ease, background .2s ease;
  }
  .cc-nick {
    display: inline-flex; align-items: center; gap: 4px;
    max-width: 0; opacity: 0; overflow: hidden; white-space: nowrap;
    font-size: 12px; font-weight: 600;
    transition: max-width .25s ease, opacity .2s ease;
  }
  .cc-auth:hover, .cc-auth:focus-visible { gap: 6px; padding-right: 10px; background: rgba(16,14,16,.82); }
  .cc-auth:hover .cc-nick, .cc-auth:focus-visible .cc-nick { max-width: 160px; opacity: 1; }
  .cc-auth:focus-visible { box-shadow: 0 0 0 2px rgba(240,171,252,.8); }
  @media (hover: none) {
    .cc-auth { gap: 6px; padding-right: 10px; }
    .cc-nick { max-width: 160px; opacity: 1; }
  }
  .cc-av {
    width: 22px; height: 22px; flex: none; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800;
    background: linear-gradient(135deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
  }
  .cc-ver { width: 12px; height: 12px; flex: none; color: rgb(var(--primary)); }
  .cc-unfav {
    position: absolute; top: 10px; right: 10px; z-index: 4;
    width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(16,14,16,.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: rgb(var(--acc-to)); display: flex; align-items: center; justify-content: center;
    transition: transform .15s, background .2s;
  }
  .cc-unfav .ic { width: 17px; height: 17px; }
  .cc-unfav:hover { background: rgba(16,14,16,.85); transform: scale(1.08); }

  /* пустое состояние */
  .my-empty {
    text-align: center; padding: 64px 40px;
    background: rgba(255,255,255,.05); border-radius: 20px;
  }
  .my-empty .ibox {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
    background: rgba(255,255,255,.08); color: rgb(var(--muted));
    display: flex; align-items: center; justify-content: center;
  }
  .my-empty .ibox .ic { width: 24px; height: 24px; }
  .my-empty h3 { font-size: 1.15rem; font-weight: 800; }
  .my-empty p { color: rgb(var(--muted)); font-size: .92rem; margin: 8px auto 18px; max-width: 44ch; }

  @media (max-width: 900px) { .my-head .btn { margin-left: 0; width: 100%; } }
  @media (max-width: 560px) { .my-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } .my-bar .seg { display: flex; } }

  /* Кнопки — по боевому lovix.ai: высота 52, радиус 12, кегль 18/600, без свечения. */
  .btn { border-radius: 12px; font-size: 1.125rem; font-weight: 600; padding: .9rem 2rem; }
  .btn-grad { box-shadow: none; }
  .btn-grad:hover { box-shadow: none; filter: brightness(1.1); }
</style>

<script>
  /* Свои модели — как на проде: карточка с чипами «Модель №N» и статусом, корзина; демо-данные */
  const MY = [
    { name: 'Марго', age: 27, desc: 'Я шеф-повар с дерзким характером и привычкой пробовать всё первой.', img: '../assets/img/hero/red.webp', bg: 'linear-gradient(160deg, #3b2a5e, #7b2d6b)', status: 'Активен' },
  ];

  /* «Избранное» — индексы ботов каталога (CATALOG_BOTS) из localStorage, ключ общий с главной */
  const FAV_KEY = 'lovix.fav';
  const favs = () => { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch (e) { return []; } };
  const SUB = {
    own: 'Управляйте персональными моделями: создавайте новые, следите за прогрессом генерации и возвращайтесь к готовым.',
    fav: 'Боты других авторов, которые вы отметили сердечком в каталоге.',
  };
  let active = location.hash === '#favorites' ? 'fav' : 'own';   // из тоста на главной — сразу во «Избранное»

  function drawSeg() {
    document.getElementById('seg').innerHTML =
      `<button data-k="own" role="tab" aria-selected="${active === 'own'}" class="${active === 'own' ? 'on' : ''}"><svg class="ic"><use href="#i-users"/></svg>Мои модели<span class="cnt">${MY.length}</span></button>` +
      `<button data-k="fav" role="tab" aria-selected="${active === 'fav'}" class="${active === 'fav' ? 'on' : ''}"><svg class="ic"><use href="#i-heart-o"/></svg>Избранное<span class="cnt">${favs().length}</span></button>`;
    document.getElementById('sub').textContent = active === 'fav' ? SUB.fav : SUB.own;
  }

  function myCardHtml(m, i) {
    return `<article class="cc" tabindex="0">
      <div class="cc-bg" style="background:${m.bg}"></div>
      <img class="cc-img" src="${m.img}" alt="${m.name}">
      <div class="cc-shade"></div>
      <button class="cc-del" type="button" aria-label="Удалить модель" title="Удалить модель"><svg class="ic"><use href="#i-trash"/></svg></button>
      <div class="cc-meta">
        <div class="cc-text">
          <div class="cc-name"><b>${m.name},</b><span>${m.age}</span></div>
          <p class="cc-desc">${m.desc}</p>
        </div>
        <div class="cc-foot">
          <span class="cc-m">Модель №${i + 1}</span>
          <span class="cc-m st">${m.status}</span>
        </div>
      </div>
    </article>`;
  }
  const newTile = `<article class="cc newtile" role="button" tabindex="0" aria-label="Создать модель">
      <span class="plus"><svg class="ic"><use href="#i-plus"/></svg></span>
      <span class="lbl">Создать модель</span>
    </article>`;

  /* карточка избранного — данные и фото из каталога главной */
  function favCardHtml(id) {
    const b = CATALOG_BOTS[id]; if (!b) return '';
    const [name, age, desc, talks, likes, by] = b, au = CATALOG_AUTHORS[by];
    return `<article class="cc fav" tabindex="0">
      <img class="cc-photo" src="../assets/img/bots/${CATALOG_MEDIA[id]}" alt="${name}" loading="lazy">
      <video class="cc-video" data-src="../assets/video/bots/${CATALOG_MEDIA[id].replace(/\.\w+$/, '.mp4')}"
             muted loop playsinline preload="none" aria-hidden="true"></video>
      <div class="cc-shade"></div>
      <a class="cc-auth" href="../author/v1.html?u=${by}" title="${au.name} · @${by}" aria-label="Автор: ${au.name}, @${by}">
        <span class="cc-av"${au.color ? ` style="background:${au.color}"` : ''}>${au.name[0].toUpperCase()}</span>
        <span class="cc-nick">@${by}${au.verified ? '<svg class="cc-ver"><use href="#i-verified"/></svg>' : ''}</span>
      </a>
      <button class="cc-unfav" type="button" data-unfav="${id}" aria-label="Убрать из избранного" title="Убрать из избранного"><svg class="ic"><use href="#i-heart-f"/></svg></button>
      <div class="cc-meta">
        <div class="cc-text">
          <div class="cc-name"><b>${name},</b><span>${age}</span></div>
          <p class="cc-desc">${desc}</p>
        </div>
        <div class="cc-foot">
          <span class="cc-m"><svg class="cc-ic"><use href="#i-cc-chat"/></svg>${talks}</span>
          <span class="cc-m like"><svg class="cc-ic"><use href="#i-cc-like"/></svg>${fmtCount(likes)}</span>
        </div>
      </div>
    </article>`;
  }

  function render() {
    const grid = document.getElementById('grid');
    if (active === 'fav') {
      const ids = favs();
      grid.innerHTML = ids.length
        ? ids.map(favCardHtml).join('')
        : `<div class="my-empty" style="grid-column:1/-1">
             <div class="ibox"><svg class="ic"><use href="#i-heart-o"/></svg></div>
             <h3>В избранном пока пусто</h3>
             <p>Отмечайте ботов сердечком в каталоге — они появятся здесь.</p>
             <a class="btn btn-grad" href="../catalog/v2.html">В каталог</a>
           </div>`;
      initBotCards(grid);                       // поведение при наведении — как в каталоге
      return;
    }
    grid.innerHTML = MY.map(myCardHtml).join('') + newTile;
    initBotCards(grid);
  }

  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]');
    if (!b) return;
    active = b.dataset.k;
    history.replaceState(null, '', active === 'fav' ? '#favorites' : location.pathname);
    drawSeg(); render();
  });
  document.addEventListener('click', e => {
    const un = e.target.closest('[data-unfav]');            // убрать из избранного
    if (!un) return;
    const id = +un.dataset.unfav;
    try { localStorage.setItem(FAV_KEY, JSON.stringify(favs().filter(x => x !== id))); } catch (err) {}
    drawSeg(); render();
  });
  addEventListener('hashchange', () => { active = location.hash === '#favorites' ? 'fav' : 'own'; drawSeg(); render(); });

  drawSeg(); render();
</script>

</body>
</html>
