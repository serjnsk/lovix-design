<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lovix — Уведомления · V1 «Дропдаун-центр»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lovix.css">
<style>
  /* подложка «Обзор» */
  .content { max-width: 1180px; }
  .feed { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 28px; }
  .tile {
    aspect-ratio: 3 / 4.1; border-radius: 1rem;
    position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.09);
  }
  .tile::after { content: ""; position: absolute; inset: 0; background: radial-gradient(140px 100px at 30% 18%, rgba(255,255,255,.16), transparent 60%), linear-gradient(180deg, transparent 55%, rgba(10,8,12,.65)); }
  .tile span { position: absolute; left: 13px; bottom: 11px; font-weight: 700; font-size: .95rem; z-index: 1; }
  @media (max-width: 940px) { .feed { grid-template-columns: repeat(2, 1fr); } }

  /* -------- дропдаун-центр уведомлений -------- */
  .bell-wrap { position: relative; }
  .npanel {
    position: absolute; top: calc(100% + 10px); right: 0;
    width: 400px; max-height: min(72vh, 640px);
    display: none; flex-direction: column;
    background: #17131c;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 40px rgba(217,70,239,.1);
    overflow: hidden; z-index: 70; text-align: left;
  }
  .npanel.open { display: flex; }
  .nhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px; }
  .nhead b { font-size: 1.05rem; font-weight: 800; }
  .nhead .cnt { color: rgb(var(--muted)); font-weight: 600; font-size: .85rem; margin-left: 6px; }
  .nacts { display: flex; gap: 4px; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; cursor: pointer; color: rgb(var(--muted));
  }
  .iconbtn:hover { background: rgba(255,255,255,.07); color: #fff; }
  .iconbtn .ic { width: 16px; height: 16px; }
  .nlist { overflow-y: auto; padding: 0 8px 10px; }
  .ngroup { font-size: .7rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: rgb(var(--muted2)); padding: 10px 10px 6px; }
  .nitem {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 11px 10px; border-radius: 12px; cursor: pointer; position: relative;
  }
  .nitem:hover { background: rgba(255,255,255,.05); }
  .nitem.unread { background: rgba(217,70,239,.07); }
  .nitem.unread:hover { background: rgba(217,70,239,.11); }
  .nitem + .nitem { margin-top: 4px; }
  .nicon { width: 38px; height: 38px; border-radius: 11px; flex: none; display: flex; align-items: center; justify-content: center; }
  .nicon .ic { width: 18px; height: 18px; }
  .nc-tok  { background: rgba(147,51,234,.28); color: #e879f9; }
  .nc-lim  { background: rgba(37,99,235,.26);  color: #93c5fd; }
  .nc-fail { background: rgba(239,68,68,.2);   color: #fca5a5; }
  .nc-pay  { background: rgba(244,63,94,.2);   color: #fda4af; }
  .nc-hello{ background: rgba(217,70,239,.22); color: #f0abfc; }
  .nc-news { background: rgba(59,130,246,.2);  color: #93c5fd; }
  .nbody { min-width: 0; flex: 1; }
  .ntitle { font-size: .9rem; font-weight: 700; line-height: 1.3; }
  .ntext { font-size: .82rem; color: rgb(var(--muted)); margin-top: 2px; line-height: 1.4; }
  .ntime { font-size: .72rem; color: rgb(var(--muted2)); margin-top: 4px; }
  .ncta { margin-top: 8px; }
  .ncta .btn { padding: .42rem .9rem; font-size: .78rem; border-radius: .5rem; }
  .ndot { width: 8px; height: 8px; border-radius: 50%; background: #e879f9; flex: none; margin-top: 6px; box-shadow: 0 0 8px rgba(217,70,239,.8); }
  .nitem:not(.unread) .ndot { visibility: hidden; }
  .nempty { padding: 34px 20px; text-align: center; color: rgb(var(--muted2)); font-size: .88rem; }

  .toast {
    position: fixed; bottom: 130px; left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #1e1b22; border: 1px solid rgba(217,70,239,.45);
    border-radius: 12px; padding: 12px 18px;
    font-size: .9rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .25s;
    z-index: 90; box-shadow: 0 14px 40px rgba(0,0,0,.55);
    max-width: min(92vw, 480px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast b { color: #f0abfc; }

  @media (max-width: 640px) {
    .npanel { position: fixed; top: 64px; left: 10px; right: 10px; width: auto; }
  }
</style>

<script src="../assets/notifs-data.js"></script>
<script>
/* Вариант 1 «Дропдаун-центр»: якорная панель под колокольчиком.
   Группы «Новые / Ранее», клик помечает прочитанным, CTA ведут к целевым действиям (Д2). */
const notifs = NOTIFS.map(n => ({ ...n }));
const panel = document.getElementById('npanel');

function updateBadge() {
  const c = notifs.filter(n => n.unread).length;
  const b = document.getElementById('bb');
  b.textContent = c;
  b.style.display = c ? 'flex' : 'none';
  document.getElementById('ncnt').textContent = c ? '· ' + c + ' новых' : '';
}

function itemHtml(n) {
  return '<div class="nitem' + (n.unread ? ' unread' : '') + '" data-id="' + n.id + '">' +
    '<div class="nicon ' + NCLASS[n.type] + '"><svg class="ic"><use href="#' + NICON[n.type] + '"/></svg></div>' +
    '<div class="nbody"><div class="ntitle">' + n.title + '</div>' +
    '<div class="ntext">' + n.text + '</div>' +
    (n.cta ? '<div class="ncta"><button class="btn btn-grad" data-cta="' + n.id + '">' + n.cta + '</button></div>' : '') +
    '<div class="ntime">' + n.time + '</div></div>' +
    '<div class="ndot"></div></div>';
}

function render() {
  const fresh = notifs.filter(n => n.unread);
  const older = notifs.filter(n => !n.unread);
  let html = '';
  if (fresh.length) html += '<div class="ngroup">Новые</div>' + fresh.map(itemHtml).join('');
  if (older.length) html += '<div class="ngroup">Ранее</div>' + older.map(itemHtml).join('');
  if (!html) html = '<div class="nempty">Пока тихо — уведомлений нет</div>';
  document.getElementById('nlist').innerHTML = html;
  updateBadge();
}

let toastTimer;
function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

document.addEventListener('click', e => {
  if (e.target.closest('#bell')) { panel.classList.toggle('open'); return; }
  const cta = e.target.closest('[data-cta]');
  if (cta) {
    const n = notifs.find(x => x.id == cta.dataset.cta);
    n.unread = false; render();
    toast('Переход: <b>' + n.cta + '</b> (сценарий ' + n.scenario + ')');
    return;
  }
  const item = e.target.closest('.nitem');
  if (item) {
    const n = notifs.find(x => x.id == item.dataset.id);
    if (n.unread) { n.unread = false; render(); }
    return;
  }
  if (e.target.closest('#nreadall')) { notifs.forEach(n => n.unread = false); render(); return; }
  if (e.target.closest('#nsettings')) { toast('Настройки: маркетинговые категории отключаемы, транзакционные — нет (Д7)'); return; }
  if (!e.target.closest('.npanel')) panel.classList.remove('open');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') panel.classList.remove('open'); });

render();
</script>
