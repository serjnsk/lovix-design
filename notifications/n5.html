<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lovix — Уведомления · V5 «Инбокс»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/lovix.css">
<style>
  .content { max-width: 1180px; }
  .feed { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 28px; }
  .tile {
    aspect-ratio: 3 / 4.1; border-radius: 1rem;
    position: relative; overflow: hidden;
    border: 1px solid rgba(255,255,255,.09);
  }
  .tile::after { content: ""; position: absolute; inset: 0; background: radial-gradient(140px 100px at 30% 18%, rgba(255,255,255,.16), transparent 60%), linear-gradient(180deg, transparent 55%, rgba(10,8,12,.65)); }
  .tile span { position: absolute; left: 13px; bottom: 11px; font-weight: 700; font-size: .95rem; z-index: 1; }
  @media (max-width: 940px) { .feed { grid-template-columns: repeat(2, 1fr); } }

  /* -------- инбокс-панель -------- */
  .bell-wrap { position: relative; }
  .npanel {
    position: absolute; top: calc(100% + 10px); right: 0;
    width: 660px; max-width: calc(100vw - 40px);
    height: min(70vh, 560px);
    display: none; flex-direction: column;
    background: #17131c;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 16px;
    box-shadow: 0 24px 70px rgba(0,0,0,.65), 0 0 40px rgba(217,70,239,.1);
    overflow: hidden; z-index: 70; text-align: left;
  }
  .npanel.open { display: flex; }
  .nhead { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px 11px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .nhead b { font-size: 1.05rem; font-weight: 800; }
  .nhead .cnt { color: rgb(var(--muted)); font-weight: 600; font-size: .85rem; margin-left: 6px; }
  .iconbtn {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: 0; cursor: pointer; color: rgb(var(--muted));
  }
  .iconbtn:hover { background: rgba(255,255,255,.07); color: #fff; }
  .iconbtn .ic { width: 16px; height: 16px; }

  .split { display: flex; flex: 1; min-height: 0; }
  .ncol { width: 256px; flex: none; border-right: 1px solid rgba(255,255,255,.08); overflow-y: auto; padding: 8px; }
  .litem {
    display: flex; gap: 9px; align-items: center;
    padding: 9px 8px; border-radius: 10px; cursor: pointer;
  }
  .litem:hover { background: rgba(255,255,255,.05); }
  .litem.sel { background: rgba(217,70,239,.14); }
  .litem + .litem { margin-top: 2px; }
  .nicon { width: 32px; height: 32px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; }
  .nicon .ic { width: 15px; height: 15px; }
  .nc-tok  { background: rgba(147,51,234,.28); color: #e879f9; }
  .nc-lim  { background: rgba(37,99,235,.26);  color: #93c5fd; }
  .nc-fail { background: rgba(239,68,68,.2);   color: #fca5a5; }
  .nc-pay  { background: rgba(244,63,94,.2);   color: #fda4af; }
  .nc-hello{ background: rgba(217,70,239,.22); color: #f0abfc; }
  .nc-news { background: rgba(59,130,246,.2);  color: #93c5fd; }
  .lbody { min-width: 0; flex: 1; }
  .ltitle { font-size: .8rem; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ltime { font-size: .68rem; color: rgb(var(--muted2)); margin-top: 2px; }
  .ldot { width: 7px; height: 7px; border-radius: 50%; background: #e879f9; flex: none; }
  .litem:not(.unread) .ldot { visibility: hidden; }

  .ndetail { flex: 1; overflow-y: auto; padding: 18px 20px; }
  .dhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .dhead .nicon { width: 42px; height: 42px; border-radius: 12px; }
  .dhead .nicon .ic { width: 20px; height: 20px; }
  .dtitle { font-size: 1.05rem; font-weight: 800; line-height: 1.25; }
  .dtime { font-size: .74rem; color: rgb(var(--muted2)); margin-top: 2px; }
  .dtext { font-size: .92rem; color: #d9d9e2; line-height: 1.55; }
  .dext { margin-top: 14px; }
  .dcta { margin-top: 16px; display: flex; gap: 9px; flex-wrap: wrap; }
  .dcta .btn { padding: .62rem 1.1rem; font-size: .88rem; }

  /* контекстные виджеты деталей */
  .mini-packs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mini-pack {
    border: 1px solid rgba(255,255,255,.13); border-radius: 11px;
    padding: 10px 8px; text-align: center; cursor: pointer;
    background: none; color: #fff; font-family: inherit; transition: border-color .15s;
  }
  .mini-pack:hover { border-color: rgba(217,70,239,.55); }
  .mini-pack b { display: block; font-size: 1.05rem; font-weight: 800; }
  .mini-pack small { color: rgb(var(--muted)); font-size: .72rem; }
  .mini-pay { display: grid; gap: 7px; }
  .mini-opt {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid rgba(255,255,255,.13); border-radius: 10px;
    padding: 9px 11px; cursor: pointer; background: none; color: #fff;
    font-family: inherit; font-size: .84rem; font-weight: 600; text-align: left;
    transition: border-color .15s;
  }
  .mini-opt:hover { border-color: rgba(217,70,239,.55); }
  .mini-opt .badge { background: #f4f4f8; border-radius: 4px; padding: 2px 4px; display: flex; gap: 2px; }
  .mini-opt .badge svg { width: 24px; height: 13px; display: block; }
  .vip-list { list-style: none; display: grid; gap: 7px; font-size: .88rem; }
  .vip-list li { display: flex; gap: 8px; align-items: center; }
  .vip-list .ic { width: 15px; height: 15px; color: #e879f9; }

  .toast {
    position: fixed; bottom: 130px; left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #1e1b22; border: 1px solid rgba(217,70,239,.45);
    border-radius: 12px; padding: 12px 18px;
    font-size: .9rem; font-weight: 600;
    opacity: 0; pointer-events: none; transition: .25s;
    z-index: 90; box-shadow: 0 14px 40px rgba(0,0,0,.55);
    max-width: min(92vw, 480px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast b { color: #f0abfc; }

  @media (max-width: 760px) {
    .npanel { position: fixed; top: 64px; left: 10px; right: 10px; width: auto; height: 74vh; }
    .ncol { width: 130px; }
    .ltitle { white-space: normal; }
  }
</style>
</head>

<script>
/* Вариант 5 «Инбокс»: сплит-панель — список слева, детальная карточка справа
   с контекстными действиями (пакеты, способы оплаты, VIP) прямо в уведомлении. */
const notifs = NOTIFS.map(n => ({ ...n }));
const panel = document.getElementById('npanel');
let sel = notifs.find(n => n.unread)?.id || notifs[0].id;

/* контекстные виджеты деталей по типу события */
const DETAIL = {
  tokens: '<div class="dext"><div class="mini-packs">' +
    '<button class="mini-pack" data-buy="100"><b>100</b><small>390 ₽</small></button>' +
    '<button class="mini-pack" data-buy="300"><b>300</b><small>1 090 ₽</small></button>' +
    '<button class="mini-pack" data-buy="700"><b>700</b><small>2 490 ₽</small></button>' +
    '</div></div>',
  pay: '<div class="dext"><div class="mini-pay">' +
    '<button class="mini-opt" data-pm="Карта РФ"><span class="badge"><svg><use href="#p-mir"/></svg></span>Карта РФ</button>' +
    '<button class="mini-opt" data-pm="Карта Worldwide"><span class="badge"><svg><use href="#p-visa"/></svg><svg><use href="#p-mc"/></svg></span>Карта Worldwide</button>' +
    '<button class="mini-opt" data-pm="Криптовалюта"><span class="badge"><svg><use href="#p-btc"/></svg><svg><use href="#p-usdt"/></svg></span>Криптовалюта</button>' +
    '</div></div>',
  limit: '<div class="dext"><ul class="vip-list">' +
    '<li><svg class="ic"><use href="#i-check"/></svg>Безлимитные сообщения</li>' +
    '<li><svg class="ic"><use href="#i-check"/></svg>550 токенов каждый месяц</li>' +
    '<li><svg class="ic"><use href="#i-check"/></svg>Видео и аудио звонки</li>' +
    '</ul></div>',
};

function updateBadge() {
  const c = notifs.filter(n => n.unread).length;
  const b = document.getElementById('bb');
  b.textContent = c;
  b.style.display = c ? 'flex' : 'none';
  document.getElementById('ncnt').textContent = c ? '· ' + c + ' новых' : '';
}

function render() {
  document.getElementById('ncol').innerHTML = notifs.map(n =>
    '<div class="litem' + (n.id === sel ? ' sel' : '') + (n.unread ? ' unread' : '') + '" data-id="' + n.id + '">' +
    '<div class="nicon ' + NCLASS[n.type] + '"><svg class="ic"><use href="#' + NICON[n.type] + '"/></svg></div>' +
    '<div class="lbody"><div class="ltitle">' + n.title + '</div><div class="ltime">' + n.time + '</div></div>' +
    '<div class="ldot"></div></div>'
  ).join('');
  const n = notifs.find(x => x.id === sel);
  document.getElementById('ndetail').innerHTML =
    '<div class="dhead"><div class="nicon ' + NCLASS[n.type] + '"><svg class="ic"><use href="#' + NICON[n.type] + '"/></svg></div>' +
    '<div><div class="dtitle">' + n.title + '</div><div class="dtime">' + n.time + ' · сценарий ' + n.scenario + '</div></div></div>' +
    '<div class="dtext">' + n.text + '</div>' +
    (DETAIL[n.type] || '') +
    (n.cta ? '<div class="dcta"><button class="btn btn-grad" data-cta="' + n.id + '">' + n.cta + '</button></div>' : '');
  updateBadge();
}

function select(id) {
  sel = id;
  const n = notifs.find(x => x.id === id);
  if (n.unread) n.unread = false;
  render();
}

let toastTimer;
function toast(html) {
  const t = document.getElementById('toast');
  t.innerHTML = html;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

document.addEventListener('click', e => {
  if (e.target.closest('#bell')) {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) select(sel);
    return;
  }
  const li = e.target.closest('.litem');
  if (li) { select(Number(li.dataset.id)); return; }
  const buy = e.target.closest('[data-buy]');
  if (buy) { toast('Чекаут пакета: <b>' + buy.dataset.buy + ' токенов</b>'); return; }
  const pm = e.target.closest('[data-pm]');
  if (pm) { toast('Повтор оплаты: <b>' + pm.dataset.pm + '</b>'); return; }
  const cta = e.target.closest('[data-cta]');
  if (cta) {
    const n = notifs.find(x => x.id == cta.dataset.cta);
    toast('Переход: <b>' + n.cta + '</b> (сценарий ' + n.scenario + ')');
    return;
  }
  if (e.target.closest('#nreadall')) { notifs.forEach(n => n.unread = false); render(); return; }
  if (!e.target.closest('.npanel')) panel.classList.remove('open');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') panel.classList.remove('open'); });

render();
</script>
</body>
</html>
