<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lovix — Тарифы: сравнение 5 вариантов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Proxima Nova", "Mulish", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --acc-from: 217 70 239;
    --acc-to: 244 63 94;
    --muted: 163 163 180;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); background: rgb(34 31 34); color: #fff; overflow: hidden; }

  .stage { position: fixed; inset: 0; z-index: 2; }
  .stage iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; opacity: 0; pointer-events: none; transition: opacity .18s;
  }
  .stage iframe.on { opacity: 1; pointer-events: auto; }

  /* ---------- плавающая переключалка ---------- */
  .bar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; align-items: center; gap: 14px;
    background: rgba(12,10,13,.88);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px;
    padding: 9px 16px 9px 12px;
    backdrop-filter: blur(16px);
    box-shadow: 0 14px 50px rgba(0,0,0,.6), 0 0 40px rgba(217,70,239,.12);
    max-width: calc(100vw - 24px);
  }
  .bar .heart { width: 22px; height: 22px; flex: none; }
  .nums { display: flex; gap: 5px; }
  .nums button {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.04);
    color: #cfcfda; font: 700 .95rem var(--font);
    cursor: pointer; transition: .15s;
  }
  .nums button:hover { color: #fff; border-color: rgba(217,70,239,.6); background: rgba(217,70,239,.14); }
  .nums button.on {
    background: linear-gradient(135deg, rgb(var(--acc-from)), rgb(var(--acc-to)));
    border-color: transparent; color: #fff;
    box-shadow: 0 4px 18px rgba(217,70,239,.5);
  }
  .info { display: grid; line-height: 1.25; min-width: 0; }
  .info b { font-size: .95rem; white-space: nowrap; }
  .info small { color: rgb(var(--muted)); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
  .sep { width: 1px; align-self: stretch; background: rgba(255,255,255,.12); }
  .open {
    display: inline-flex; align-items: center; gap: 6px;
    color: #f0abfc; font-size: .82rem; font-weight: 700;
    text-decoration: none; white-space: nowrap;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid rgba(217,70,239,.35);
    transition: .15s;
  }
  .open:hover { background: rgba(217,70,239,.15); }
  .open svg { width: 13px; height: 13px; }
  .keys-hint {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.35); font-size: .72rem; z-index: 99;
    background: rgba(12,10,13,.6); padding: 4px 12px; border-radius: 999px;
    backdrop-filter: blur(8px); pointer-events: none;
    opacity: 1; transition: opacity .4s;
  }
  .keys-hint.hide { opacity: 0; }

  .loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgb(var(--muted)); font-size: .95rem; z-index: 1;
  }

  @media (max-width: 760px) {
    .info small, .keys-hint { display: none; }
    .bar { gap: 10px; padding: 8px 12px; }
    .open span { display: none; }
  }
  @media (max-width: 480px) {
    .info { display: none; }
  }
</style>
</head>
<body>

<div class="loading">Загрузка вариантов…</div>

<div class="stage" id="stage"></div>

<div class="keys-hint" id="hint">клавиши 1–5 и ← → переключают варианты</div>

<div class="bar">
  <svg class="heart" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g-acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d946ef"/><stop offset="1" stop-color="#f43f5e"/></linearGradient></defs>
    <path d="M12 21C7 16.5 2 12.8 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 4.3-5 8-10 12.5z" fill="url(#g-acc)"/>
    <path d="m12.5 4.5-2 4.2 3.2 2.6-2.2 4.5" fill="none" stroke="rgba(20,10,20,.55)" stroke-width="1.4" stroke-linejoin="round"/>
  </svg>
  <div class="nums" id="nums"></div>
  <div class="sep"></div>
  <div class="info">
    <b id="vname"></b>
    <small id="vdesc"></small>
  </div>
  <div class="sep"></div>
  <a class="open" id="vopen" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
    <span>открыть отдельно</span>
  </a>
</div>

<script>
const VARIANTS = [
  { file: 'v1.html', name: '1 · Классика',           desc: 'чистый лейаут: тарифы, FAQ, оплата в карточках' },
  { file: 'v2.html', name: '2 · Амбиент-фон',        desc: 'девушки вторым планом за хиро, тарифы не тронуты' },
  { file: 'v3.html', name: '3 · Живой виджет',       desc: 'сторис-аватар в углу с автосменой фото' },
  { file: 'v4.html', name: '4 · Девушка-колонка',    desc: 'слайдер-колонка слева, сетка тарифов справа' },
  { file: 'v5.html', name: '5 · Девушка в сетке',    desc: 'слайдер как карточка рядом с тарифами' },
];

const stage = document.getElementById('stage');
const nums = document.getElementById('nums');
const frames = [];
let current = -1;
let period = 'm1';   // общее состояние периода для всех вариантов

/* создаём фреймы и кнопки */
VARIANTS.forEach((v, i) => {
  const f = document.createElement('iframe');
  f.src = v.file;
  f.title = v.name;
  f.loading = 'eager';
  stage.appendChild(f);
  frames.push(f);
  hookFrame(f);

  const b = document.createElement('button');
  b.textContent = i + 1;
  b.setAttribute('aria-label', v.name);
  b.addEventListener('click', () => show(i));
  nums.appendChild(b);
});

function hookFrame(f) {
  f.addEventListener('load', () => {
    try {
      const d = f.contentDocument;
      d.body.style.paddingBottom = '110px';           // чтобы бар не перекрывал низ
      d.addEventListener('click', e => {
        const b = e.target.closest('[data-period]');
        if (b) { period = b.dataset.period; syncPeriod(f); }
      });
      d.addEventListener('keydown', onKeys);          // клавиши работают и при фокусе внутри варианта
      applyPeriod(f);
    } catch (e) {}
  });
}

function applyPeriod(f) {
  try {
    const btn = f.contentDocument.querySelector('[data-period="' + period + '"]');
    if (btn && !btn.classList.contains('on')) btn.click();
  } catch (e) {}
}
function syncPeriod(except) {
  frames.forEach(f => { if (f !== except) applyPeriod(f); });
}

function show(i) {
  if (i === current) return;
  current = i;
  frames.forEach((f, k) => f.classList.toggle('on', k === i));
  [...nums.children].forEach((b, k) => b.classList.toggle('on', k === i));
  document.getElementById('vname').textContent = VARIANTS[i].name;
  document.getElementById('vdesc').textContent = VARIANTS[i].desc;
  document.getElementById('vopen').href = VARIANTS[i].file;
  history.replaceState(null, '', '#v' + (i + 1));
  applyPeriod(frames[i]);
}

/* клавиатура: 1–5, стрелки */
function onKeys(e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= VARIANTS.length) show(n - 1);
  else if (e.key === 'ArrowRight') show((current + 1) % VARIANTS.length);
  else if (e.key === 'ArrowLeft') show((current - 1 + VARIANTS.length) % VARIANTS.length);
}
document.addEventListener('keydown', onKeys);

/* стартовый вариант из hash */
const m = location.hash.match(/^#v([1-5])$/);
show(m ? parseInt(m[1], 10) - 1 : 0);

/* подсказка о клавишах гаснет */
setTimeout(() => document.getElementById('hint').classList.add('hide'), 5000);
</script>
</body>
</html>
