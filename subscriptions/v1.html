<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lovix — Мои подписки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* ── «Мои подписки». Классы su-, общие стили не трогаются ── */

  .content { max-width: 1240px; }

  .su-bar { margin: 28px 0 22px; }
  .su-bar .seg button { padding: .46rem .95rem; font-size: .85rem; gap: .4rem; }
  .seg .cnt {
    font-size: .72rem; font-weight: 800;
    padding: .16rem .45rem; border-radius: 999px;
    background: rgba(217,70,239,.16); color: #f0abfc;
  }
  .seg button.on .cnt { background: rgba(0,0,0,.28); color: #fff; }

  .su-list { display: grid; gap: 10px; }

  /* строка автора — подложка та же, что на странице автора: белая 5%, радиус 20 */
  .su-row {
    background: rgba(255,255,255,.05);
    border-radius: 20px;
    padding: 12px 16px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  }
  .su-ava {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, rgb(var(--card-from)), rgb(var(--card-to)));
    display: flex; align-items: center; justify-content: center;
    font-size: .95rem; font-weight: 800;
    box-shadow: 0 6px 18px rgba(147,51,234,.28);
  }
  .su-nick { display: flex; align-items: center; gap: 6px; font-size: .95rem; font-weight: 700; line-height: 1.2; }
  .su-ver { width: 13px; height: 13px; color: rgb(var(--primary)); flex: none; }
  .su-new {
    font-size: .66rem; font-weight: 800; letter-spacing: .02em;
    padding: 1px 7px; border-radius: 999px;
    background: rgba(217,70,239,.2); color: #f0abfc;
  }
  .su-meta { display: flex; align-items: baseline; flex-wrap: wrap; margin-top: 2px; color: rgb(var(--muted)); font-size: .78rem; }
  .su-meta span { padding: 0 10px; border-left: 1px solid rgba(255,255,255,.16); }
  .su-meta span:first-child { padding-left: 0; border-left: 0; }
  .su-meta b { color: #fff; font-weight: 600; }

  .su-act { flex: none; }
  .su-btn {
    cursor: pointer; white-space: nowrap; font-family: inherit;
    padding: .4rem .9rem; border-radius: 999px;
    font-size: .8rem; font-weight: 700; color: #fff;
    border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.04);
    transition: border-color .15s, background .15s, color .15s;
  }
  .su-btn:hover { border-color: rgb(var(--primary)); background: rgba(217,70,239,.13); }
  .su-btn.on { background: rgba(217,70,239,.18); border-color: rgba(217,70,239,.5); color: #f0abfc; }

    width: 54px; height: 70px; border-radius: 10px; flex: none;
    position: relative; overflow: hidden; cursor: pointer; transition: transform .15s;
  }
  .su-w:hover { transform: translateY(-2px); }
  .su-more {
    width: 54px; height: 70px; border-radius: 10px; flex: none;
    background: rgba(255,255,255,.07); color: rgb(var(--muted));
    display: flex; align-items: center; justify-content: center;
    font-size: .85rem; font-weight: 700; cursor: pointer;
  }
  .su-more:hover { background: rgba(255,255,255,.12); color: #fff; }

  .su-empty {
    text-align: center; padding: 64px 40px;
    background: rgba(255,255,255,.05); border-radius: 20px;
  }
  .su-empty .ibox {
    width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px;
    background: rgba(255,255,255,.08); color: rgb(var(--muted));
    display: flex; align-items: center; justify-content: center;
  }
  .su-empty .ibox .ic { width: 24px; height: 24px; }
  .su-empty h3 { font-size: 1.15rem; font-weight: 800; }
  .su-empty p { color: rgb(var(--muted)); font-size: .92rem; margin: 8px auto 18px; max-width: 46ch; }


  /* тост — компонент из центра уведомлений, поднят к верху экрана */
  .toast {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-14px);
    background: #1e1b22; border: 1px solid rgba(217,70,239,.45);
    border-radius: 12px; padding: 12px 18px;
    font-size: .9rem; font-weight: 600; color: #fff;
    opacity: 0; pointer-events: none; transition: .25s;
    z-index: 95; box-shadow: 0 14px 40px rgba(0,0,0,.55);
    max-width: min(92vw, 480px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast b { color: #f0abfc; }

  @media (max-width: 700px) {
    .su-row { grid-template-columns: auto 1fr; }
    .su-act { grid-column: 1 / -1; }
    .su-btn { width: 100%; }
  }
</style>

  <main class="content">

    <h1 class="h1">Мои подписки</h1>
    <p class="sub">Авторы, за которыми вы следите. Когда кто-то из них публикует нового компаньона, вы получаете уведомление.</p>

<div class="toast" id="toast" role="status"></div>

<script>
  /* Подписки — на кого подписан пользователь. Подписчики — кто подписан на него как на автора. */
  const SUBS = [
    { nick: 'lunaria',   ver: false, bots: 12, acts: '1.24 млн', fresh: 2 },
    { nick: 'lovix',     ver: true,  bots: 48, acts: '18.6 млн', fresh: 0 },
    { nick: 'nochnoy',   ver: false, bots: 7,  acts: '486k',     fresh: 1 },
    { nick: 'kseniya_w', ver: false, bots: 4,  acts: '212k',     fresh: 0 },
    { nick: 'mirela',    ver: false, bots: 9,  acts: '904k',     fresh: 0 },
  ];

  const FOLLOWERS = [
    { nick: 'thebigbadwolf', ver: false, bots: 3,  acts: '96k',     back: false },
    { nick: 'aurora_v',      ver: false, bots: 15, acts: '2.1 млн', back: true  },
    { nick: 'some1cool',     ver: false, bots: 1,  acts: '12k',     back: false },
    { nick: 'dreamsin',      ver: false, bots: 6,  acts: '340k',    back: false },
  ];


  /* всплывающее уведомление о подписке */
  let toastT;
  function toast(html) {
    const t = document.getElementById('toast');
    t.innerHTML = html;
    t.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function subToast(on, nick) {
    toast(on ? `Вы подписались на <b>@${nick}</b>` : `Вы отписались от <b>@${nick}</b>`);
  }

  const TABS = [['subs', 'Подписки', SUBS.length], ['fol', 'Подписчики', FOLLOWERS.length]];
  let active = 'subs';

  function rowHtml(a, isSub) {
    const btn = isSub
      ? '<button class="su-btn on">Вы подписаны</button>'
      : `<button class="su-btn ${a.back ? 'on' : ''}">${a.back ? 'Вы подписаны' : 'Подписаться'}</button>`;
    return `<div class="su-row">
      <div class="su-ava">${a.nick[0].toUpperCase()}</div>
      <div>
        <div class="su-nick">@${a.nick}${a.ver ? '<svg class="su-ver"><use href="#i-verified"/></svg>' : ''}${a.fresh ? `<span class="su-new">${a.fresh} новых</span>` : ''}</div>
        <div class="su-meta">
          <span><b>${a.bots}</b> компаньонов</span>
          <span><b>${a.acts}</b> взаимодействий</span>
        </div>
      </div>
      <div class="su-act">${btn}</div>
    </div>`;
  }

  function drawSeg() {
    document.getElementById('seg').innerHTML = TABS.map(([k, label, n]) =>
      `<button data-k="${k}" class="${k === active ? 'on' : ''}">${label}<span class="cnt">${n}</span></button>`).join('');
  }

  function render() {
    const list = active === 'subs' ? SUBS : FOLLOWERS;
    document.getElementById('list').innerHTML = list.length
      ? list.map(a => rowHtml(a, active === 'subs')).join('')
      : `<div class="su-empty">
           <div class="ibox"><svg class="ic"><use href="#i-heart-o"/></svg></div>
           <h3>Пока никого нет</h3>
           <p>Подпишитесь на авторов в каталоге — и не пропустите их новых компаньонов.</p>
           <button class="btn btn-grad">Перейти в каталог</button>
         </div>`;
  }

  document.getElementById('seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    active = b.dataset.k; drawSeg(); render();
  });

  document.getElementById('list').addEventListener('click', e => {
    const b = e.target.closest('.su-btn'); if (!b) return;
    const on = b.classList.toggle('on');
    b.textContent = on ? 'Вы подписаны' : 'Подписаться';
    const nick = b.closest('.su-row').querySelector('.su-nick').textContent.trim().replace(/^@/, '').split(/\s/)[0];
    subToast(on, nick);
  });

  drawSeg(); render();
</script>
